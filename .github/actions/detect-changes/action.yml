name: 'Detect Changes'
description: 'Detect which services and libraries have changed in the monorepo'

inputs:
  base-ref:
    description: 'Base ref for comparison (default: origin/main for PRs)'
    required: false
    default: ''
  force-all:
    description: 'Force full rebuild (all services and libraries)'
    required: false
    default: 'false'

outputs:
  services:
    description: 'JSON array of changed services'
    value: ${{ steps.detect.outputs.services }}
  libraries:
    description: 'JSON array of changed libraries'
    value: ${{ steps.detect.outputs.libraries }}
  has-service-changes:
    description: 'Whether any services changed'
    value: ${{ steps.detect.outputs.has_service_changes }}
  has-library-changes:
    description: 'Whether any libraries changed'
    value: ${{ steps.detect.outputs.has_library_changes }}
  has-ui-changes:
    description: 'Whether atlas-ui changed'
    value: ${{ steps.detect.outputs.has_ui_changes }}
  has-go-workspace-changes:
    description: 'Whether go.work changed (triggers all Go builds)'
    value: ${{ steps.detect.outputs.has_go_workspace_changes }}
  has-workflow-changes:
    description: 'Whether .github workflows changed'
    value: ${{ steps.detect.outputs.has_workflow_changes }}
  deploy-only:
    description: 'Whether every changed file lives under deploy/ (no Go, UI, template, or workflow source touched)'
    value: ${{ steps.detect.outputs.deploy_only }}
  has-guard-tooling-changes:
    description: 'Whether anything under tools/ changed (a guard analyzer, its shared driver, or a guard wrapper) — forces a full-repo guard sweep'
    value: ${{ steps.detect.outputs.has_guard_tooling_changes }}
  all-go-services:
    description: 'JSON array of all Go services (for full rebuilds)'
    value: ${{ steps.detect.outputs.all_go_services }}
  all-go-libraries:
    description: 'JSON array of all Go libraries (for full rebuilds)'
    value: ${{ steps.detect.outputs.all_go_libraries }}
  go-services-matrix:
    description: 'JSON array of Go services to test/build'
    value: ${{ steps.affected.outputs.go-services }}
  go-libraries-matrix:
    description: 'JSON array of Go libraries to test'
    value: ${{ steps.affected.outputs.go-libraries }}
  docker-services-matrix:
    description: 'JSON array of services to build Docker images for'
    value: ${{ steps.affected.outputs.docker-services }}
  selection-reason:
    description: 'Human-readable reason for the selection'
    value: ${{ steps.affected.outputs.reason }}
  mode:
    description: 'PR-environment mode: "sparse" or "isolated" (task-232 FR-9.2/9.3)'
    value: ${{ steps.mode.outputs.mode }}
  override-services:
    description: 'Space-separated override-service set for sparse mode (always includes the atlas-login/atlas-channel floor; empty for isolated mode)'
    value: ${{ steps.mode.outputs.override-services }}
  mode-reason:
    description: 'Human-readable reason the mode was chosen, including whether it was forced by an atlas:sparse/atlas:isolated label (task-232 FR-9.5/9.7)'
    value: ${{ steps.mode.outputs.mode-reason }}

runs:
  using: 'composite'
  steps:
    - name: Fetch base branch for comparison
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin ${{ github.base_ref }} --depth=1
        else
          # For push events, fetch the exact "before" SHA from the push payload.
          # HEAD~1 is unreliable when pushes land in rapid succession: the ref
          # may have advanced between the push and when checkout ran, and
          # a second push's parent isn't reachable from the first push's HEAD.
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ]; then
            git fetch origin "$BEFORE" --depth=1 || \
              echo "Warning: could not fetch before-SHA $BEFORE; will fall back to HEAD~1"
          fi
        fi

    - name: Detect changed files and services
      id: detect
      shell: bash
      run: |
        # Determine base ref for comparison
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_REF="origin/${{ github.base_ref }}"
        elif [ -n "${{ inputs.base-ref }}" ]; then
          BASE_REF="${{ inputs.base-ref }}"
        else
          # Prefer the push payload's "before" SHA over HEAD~1. HEAD~1 assumes
          # the checkout landed on the push's "after" SHA, which is racy when
          # main advances between the push event and the runner starting.
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            BASE_REF="$BEFORE"
          else
            BASE_REF="HEAD~1"
          fi
        fi

        echo "Comparing against: $BASE_REF"

        # Get list of changed files
        CHANGED_FILES=$(git diff --name-only $BASE_REF HEAD 2>/dev/null || echo "")
        echo "Changed files:"
        echo "$CHANGED_FILES"

        # Persisted for the "Compute mode" step below — mode-select.sh
        # decides sparse-vs-isolated (task-232 FR-9.2/9.3) from the exact
        # same changed-file list every other output here uses, rather than
        # re-deriving it from a second `git diff`.
        printf '%s\n' "$CHANGED_FILES" > "${RUNNER_TEMP}/detect-changes-files.txt"

        # Initialize arrays
        CHANGED_SERVICES=()
        CHANGED_LIBRARIES=()

        # Check for global triggers
        HAS_GO_WORKSPACE_CHANGES="false"
        HAS_WORKFLOW_CHANGES="false"
        HAS_UI_CHANGES="false"

        if echo "$CHANGED_FILES" | grep -q "^go\.work"; then
          HAS_GO_WORKSPACE_CHANGES="true"
          echo "go.work changed - will trigger all Go builds"
        fi

        if echo "$CHANGED_FILES" | grep -q "^\.github/"; then
          HAS_WORKFLOW_CHANGES="true"
          echo ".github changed - will trigger all builds"
        fi

        # The shared Dockerfile and docker-bake.hcl live at repo root, not
        # under any services/<svc>/ path, so the per-service detector below
        # misses them. A change to either affects every Docker image — treat
        # it as a workflow-level change so cideps lights up --force-all and
        # update-pr-overlay re-tags every service.
        if echo "$CHANGED_FILES" | grep -qE "^(Dockerfile|docker-bake\.hcl)$"; then
          HAS_WORKFLOW_CHANGES="true"
          echo "shared Dockerfile/docker-bake.hcl changed - will trigger all builds"
        fi

        # Guard-tooling detection.
        #
        # The Go analyzer guards are gated on the affected-module matrices —
        # an analyzer cannot find a new violation in a change set containing
        # no Go. But the guards' OWN source lives under tools/, and a change
        # there moves the verdict on code that did not change at all: a new
        # rule in tools/outboxguard, a scope change in
        # tools/lib/analyzer-guard.sh, or a rewritten wrapper. Those changes
        # produce empty module matrices, so without this signal the one PR
        # that most needs a full sweep would skip the guards entirely.
        #
        # Deliberately coarse (all of tools/): the guards are cheap to
        # over-run and expensive to under-run, and tools/ changes are rare.
        HAS_GUARD_TOOLING_CHANGES="false"
        if echo "$CHANGED_FILES" | grep -q "^tools/"; then
          HAS_GUARD_TOOLING_CHANGES="true"
          echo "tools/ changed - Go analyzer guards will run a full-repo sweep"
        fi

        # Deploy-only detection.
        #
        # True only when the diff is non-empty AND every changed path lives
        # under deploy/. The canonical case is the automated
        # "chore(images): bump main overlay to <sha>" PR, which rewrites
        # deploy/k8s/overlays/main/kustomization.yaml plus the per-tenant
        # deploy/seed/**/CATALOG_REVISION files and nothing else.
        #
        # Consumers use this to skip guards whose entire input surface is
        # services/** or libs/** — they cannot change verdict when no file
        # outside deploy/ moved. Guards that DO read deploy/ (gen-lb-ports
        # reads deploy/k8s/base/versions.json; service-registration-guard
        # reads deploy/k8s/overlays/main/kustomization.yaml) stay ungated.
        #
        # Fail safe on three counts: an empty or unreadable diff yields
        # "false"; force-all yields "false" (an operator who explicitly
        # asked for a full sweep gets one, even when the diff happens to
        # be deploy-only); and consumers gate with `!= 'true'`, so any
        # unexpected value runs the guard rather than skipping it.
        DEPLOY_ONLY="false"
        if [ "${{ inputs.force-all }}" = "true" ]; then
          echo "force-all requested - deploy-only suppressed, full guard set will run"
        elif [ -n "$CHANGED_FILES" ] && ! echo "$CHANGED_FILES" | grep -qv "^deploy/"; then
          DEPLOY_ONLY="true"
          echo "deploy-only change set - source-only guards will be skipped"
        fi

        # Detect changed services
        while IFS= read -r file; do
          if [[ "$file" =~ ^services/([^/]+)/ ]]; then
            SERVICE="${BASH_REMATCH[1]}"
            if [[ ! " ${CHANGED_SERVICES[*]} " =~ " ${SERVICE} " ]]; then
              CHANGED_SERVICES+=("$SERVICE")
              if [[ "$SERVICE" == "atlas-ui" ]]; then
                HAS_UI_CHANGES="true"
              fi
            fi
          fi
        done <<< "$CHANGED_FILES"

        # Detect changed libraries
        while IFS= read -r file; do
          if [[ "$file" =~ ^libs/([^/]+)/ ]]; then
            LIBRARY="${BASH_REMATCH[1]}"
            if [[ ! " ${CHANGED_LIBRARIES[*]} " =~ " ${LIBRARY} " ]]; then
              CHANGED_LIBRARIES+=("$LIBRARY")
            fi
          fi
        done <<< "$CHANGED_FILES"

        # Build all services/libraries lists (for full rebuilds)
        ALL_GO_SERVICES=()
        for dir in services/atlas-*/; do
          SERVICE=$(basename "$dir")
          if [[ "$SERVICE" != "atlas-ui" ]]; then
            ALL_GO_SERVICES+=("$SERVICE")
          fi
        done

        ALL_GO_LIBRARIES=()
        for dir in libs/atlas-*/; do
          LIBRARY=$(basename "$dir")
          ALL_GO_LIBRARIES+=("$LIBRARY")
        done

        # Convert arrays to JSON (compact, single-line format required for GITHUB_OUTPUT)
        services_json=$(printf '%s\n' "${CHANGED_SERVICES[@]}" | jq -R . | jq -sc .)
        libraries_json=$(printf '%s\n' "${CHANGED_LIBRARIES[@]}" | jq -R . | jq -sc .)
        all_go_services_json=$(printf '%s\n' "${ALL_GO_SERVICES[@]}" | jq -R . | jq -sc .)
        all_go_libraries_json=$(printf '%s\n' "${ALL_GO_LIBRARIES[@]}" | jq -R . | jq -sc .)

        # Handle empty arrays
        if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
          services_json="[]"
        fi
        if [ ${#CHANGED_LIBRARIES[@]} -eq 0 ]; then
          libraries_json="[]"
        fi

        # Set outputs
        echo "services=$services_json" >> $GITHUB_OUTPUT
        echo "libraries=$libraries_json" >> $GITHUB_OUTPUT
        echo "all_go_services=$all_go_services_json" >> $GITHUB_OUTPUT
        echo "all_go_libraries=$all_go_libraries_json" >> $GITHUB_OUTPUT
        echo "has_service_changes=$( [ ${#CHANGED_SERVICES[@]} -gt 0 ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
        echo "has_library_changes=$( [ ${#CHANGED_LIBRARIES[@]} -gt 0 ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
        echo "has_ui_changes=$HAS_UI_CHANGES" >> $GITHUB_OUTPUT
        echo "has_go_workspace_changes=$HAS_GO_WORKSPACE_CHANGES" >> $GITHUB_OUTPUT
        echo "has_workflow_changes=$HAS_WORKFLOW_CHANGES" >> $GITHUB_OUTPUT
        echo "deploy_only=$DEPLOY_ONLY" >> $GITHUB_OUTPUT
        echo "has_guard_tooling_changes=$HAS_GUARD_TOOLING_CHANGES" >> $GITHUB_OUTPUT

        # Summary
        echo ""
        echo "=== Detection Summary ==="
        echo "Changed services: ${CHANGED_SERVICES[*]:-none}"
        echo "Changed libraries: ${CHANGED_LIBRARIES[*]:-none}"
        echo "UI changes: $HAS_UI_CHANGES"
        echo "Go workspace changes: $HAS_GO_WORKSPACE_CHANGES"
        echo "Workflow changes: $HAS_WORKFLOW_CHANGES"
        echo "Deploy-only: $DEPLOY_ONLY"
        echo "Guard tooling changes: $HAS_GUARD_TOOLING_CHANGES"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.0'
        cache: false

    - name: Compute affected modules
      id: affected
      shell: bash
      run: |
        set -eo pipefail

        CHANGED_LIBS=$(echo '${{ steps.detect.outputs.libraries }}' | jq -r '. // [] | join(",")')
        CHANGED_SERVICES=$(echo '${{ steps.detect.outputs.services }}' | jq -r '. // [] | join(",")')

        FORCE_FLAGS=""
        if [ "${{ steps.detect.outputs.has_go_workspace_changes }}" = "true" ] \
          || [ "${{ steps.detect.outputs.has_workflow_changes }}" = "true" ] \
          || [ "${{ inputs.force-all }}" = "true" ]; then
          FORCE_FLAGS="--force-all"
          echo "force-all triggered by: go.work=${{ steps.detect.outputs.has_go_workspace_changes }} workflow=${{ steps.detect.outputs.has_workflow_changes }} input=${{ inputs.force-all }}"
        fi

        CONFIG=".github/config/services.json"

        if OUT=$(go run ./tools/cideps \
            --changed-libs="$CHANGED_LIBS" \
            --changed-services="$CHANGED_SERVICES" \
            --config="$CONFIG" \
            $FORCE_FLAGS 2>cideps.err); then
          echo "$OUT" > affected.json
          echo "go-services=$(jq -c '."go-services"' affected.json)" >> $GITHUB_OUTPUT
          echo "go-libraries=$(jq -c '."go-libraries"' affected.json)" >> $GITHUB_OUTPUT
          echo "docker-services=$(jq -c '."docker-services"' affected.json)" >> $GITHUB_OUTPUT
          REASON=$(jq -r '.reason' affected.json)
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          if [ -s cideps.err ]; then
            echo "::warning::cideps emitted warnings:"
            cat cideps.err
          fi
          {
            echo "### Affected modules";
            echo "$REASON";
            echo "";
            echo "- **Services**: $(jq -r '."go-services" | length' affected.json)";
            echo "- **Libraries**: $(jq -r '."go-libraries" | length' affected.json)";
            echo "- **Docker builds**: $(jq -r '."docker-services" | length' affected.json)";
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::warning::cideps failed with exit code $?, falling back to build-all"
          echo "cideps stderr:"
          cat cideps.err
          # Fallback: emit full matrices directly from services.json.
          echo "go-services=$(jq -c '[.services[] | select(.type == "go-service") | {name, path, module_path, docker_image}]' "$CONFIG")" >> $GITHUB_OUTPUT
          echo "go-libraries=$(jq -c '[.libraries[] | {name, path, module_path, coverage_threshold: (.coverage_threshold // 0)}]' "$CONFIG")" >> $GITHUB_OUTPUT
          echo "docker-services=$(jq -c '[.services[] | select(.docker_image != null) | {name, path, docker_context: (.docker_context // .path), docker_image}]' "$CONFIG")" >> $GITHUB_OUTPUT
          echo "reason=cideps failed; fell back to build-all" >> $GITHUB_OUTPUT
          {
            echo "### Affected modules";
            echo "cideps FAILED — fell back to full rebuild";
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Compute mode
      id: mode
      shell: bash
      run: |
        set -euo pipefail
        # FR-9.5: the atlas:sparse / atlas:isolated labels force the mode
        # in either direction. Read them straight from the event payload
        # ($GITHUB_EVENT_PATH is available to every step in the job, no
        # extra input/permission needed to read a local file) rather than
        # an API call. Both labels present at once is an error, not a
        # precedence rule — mode-select.sh rejects it (exit 2) rather than
        # silently picking one.
        FORCE_MODE=""
        if [ "${{ github.event_name }}" = "pull_request" ] && [ -f "${GITHUB_EVENT_PATH:-/dev/null}" ]; then
          LABELS=$(jq -r '.pull_request.labels[]?.name // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          HAS_SPARSE=0
          HAS_ISOLATED=0
          echo "$LABELS" | grep -qx 'atlas:sparse' && HAS_SPARSE=1
          echo "$LABELS" | grep -qx 'atlas:isolated' && HAS_ISOLATED=1
          if [ "$HAS_SPARSE" -eq 1 ] && [ "$HAS_ISOLATED" -eq 1 ]; then
            FORCE_MODE="sparse isolated"
          elif [ "$HAS_SPARSE" -eq 1 ]; then
            FORCE_MODE="sparse"
          elif [ "$HAS_ISOLATED" -eq 1 ]; then
            FORCE_MODE="isolated"
          fi
        fi

        # tools/mode-select.sh decides sparse-vs-isolated (task-232
        # FR-9.2/9.3) from the SAME changed-file list the "detect" step
        # above persisted — not a re-derived diff.
        RESULT=$(ATLAS_FORCE_MODE="$FORCE_MODE" tools/mode-select.sh < "${RUNNER_TEMP}/detect-changes-files.txt")
        MODE=$(echo "$RESULT" | sed -n '1p')
        OVERRIDES=$(echo "$RESULT" | sed -n '2p')
        REASON=$(echo "$RESULT" | sed -n '3p')
        echo "mode=$MODE" >> $GITHUB_OUTPUT
        echo "override-services=$OVERRIDES" >> $GITHUB_OUTPUT
        echo "mode-reason=$REASON" >> $GITHUB_OUTPUT
        echo "PR-environment mode: $MODE ($REASON)"
        [ -n "$OVERRIDES" ] && echo "Override services: $OVERRIDES"
        {
          echo "### PR-environment mode";
          echo "**$MODE**${OVERRIDES:+ (override set: \`$OVERRIDES\`)}";
          echo "Reason: $REASON";
        } >> "$GITHUB_STEP_SUMMARY"
