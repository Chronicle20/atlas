name: PR Cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to clean up'
        required: true
        type: string

concurrency:
  group: pr-cleanup-${{ github.event.pull_request.number || github.event.inputs.pr-number }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}

jobs:
  # Image-tag deletion intentionally NOT done here.
  #
  # Deleting the per-PR `pr-<N>-*` ghcr tags on PR close races the Argo CD
  # teardown. Argo deletes the Application immediately on close, but an
  # auto-sync already in flight keeps running — on PR #1459 it ran for four
  # more minutes and kept creating hook resources. That sync's
  # `atlas-pr-bootstrap` hook then pulls the tags this job just deleted and
  # fails with `Failed to pull image
  # "ghcr.io/chronicle20/atlas-data/atlas-data:pr-1459-99281705": ... not
  # found`, hangs in `wait-ready`, and never reaches a terminal condition —
  # which holds `argocd.argoproj.io/hook-finalizer` and deadlocks the whole
  # namespace teardown. Reproduced 2026-08-26 on PR #1459.
  #
  # This job was also a pure duplicate. `cleanup.sh::do_drop_images`
  # (`services/atlas-pr-bootstrap/scripts/cleanup.sh:465`, registered in
  # the phase list at line 592) matches the same `pr-<N>-*` prefix over the
  # same `.github/config/services.json`-derived service list, using the
  # in-cluster `atlas-pr-cleanup-gh-token` PAT. It runs PostDelete — after
  # the namespace is pruned — which is the only point at which no consumer
  # of those tags can still exist.
  #
  # Tag lifetime is now coupled to PostDelete Job lifetime — see
  # `docs/runbooks/ephemeral-pr-deployments.md` §9.4.

  # Branch deletion intentionally NOT done here.
  #
  # `bot/pr-<N>-resolved` is the Argo CD ApplicationSet's targetRevision.
  # Argo CD's PostDelete Job
  # (`deploy/k8s/overlays/pr/postdelete-cleanup.yaml`) fires *immediately*
  # on PR close / `deploy-env` label removal. The Job's cleanup.sh deletes
  # the bot branch as its last step using the dedicated
  # atlas-pr-cleanup-gh-token PAT (Contents: write on Chronicle20/atlas).
  #
  # If we deleted the branch here on PR close, the Application's
  # PostDelete render — which targets bot/pr-<N>-resolved — would fail
  # with `unable to resolve 'bot/pr-<N>-resolved' to a commit SHA`,
  # `post-delete-finalizer.argocd.argoproj.io/cleanup` couldn't complete,
  # and the Application would wedge in Terminating. Reproduced 2026-05-16
  # on PR #461.
  #
  # Branch lifetime is now coupled to PostDelete Job lifetime — see
  # `docs/runbooks/ephemeral-pr-deployments.md` §9.4.

  notify-argo:
    name: Notify Argo of PR close
    runs-on: ubuntu-latest
    steps:
      - name: Log notice
        run: |
          echo "PR ${PR_NUMBER} closed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Argo CD's ApplicationSet will delete the Application immediately."
          echo "The PostDelete Job runs in the argocd namespace and reclaims"
          echo "per-env state (DBs, topics, groups, Redis keys, ghcr tags,"
          echo "bot branch) within ~10 minutes."
          echo "Recovery procedure if the teardown wedges:"
          echo "  docs/runbooks/ephemeral-pr-deployments.md §9.4 (force-cleanup),"
          echo "  §9.11 (full orphan sweep)."
