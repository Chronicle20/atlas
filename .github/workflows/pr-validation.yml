name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      force-all:
        description: 'Force validation of all services'
        required: false
        default: 'false'
        type: boolean

concurrency:
  # Two concurrency lanes per PR — one for push/synchronize events (the
  # noisy lane: cancels in-progress when the user pushes a new commit),
  # and a separate lane for `labeled` events (the rare lane: must not be
  # cancelled by an in-flight build).
  #
  # When a user pushes a commit and adds `deploy-env` in quick succession,
  # GitHub fires both `synchronize` and `labeled` events. With a single
  # shared lane and `cancel-in-progress: true`, whichever fired second
  # cancelled the first — and the surviving run's `pull_request.labels`
  # payload reflected the state at fire time, missing the label if push
  # came first. Result: `update-pr-overlay` gated on
  # `contains(github.event.pull_request.labels.*.name, 'deploy-env')`
  # was skipped, the bot branch never updated, Argo CD continued syncing
  # against stale image tags. See issue #597.
  #
  # Splitting the lane preserves cancel-in-progress for normal push
  # churn while letting `labeled` events run to completion. The
  # trade-off: a push+label race produces two concurrent CI runs (the
  # push lane builds without push=true; the labeled lane builds with
  # push=true and updates the bot branch). The wasted compute is fine
  # — the alternative is silent stale-overlay teardowns.
  group: pr-${{ github.head_ref || github.ref }}${{ github.event.action == 'labeled' && '-labeled' || '' }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.0'
  NODE_VERSION: '22'

jobs:
  # ============================================
  # Detect which services/libraries have changed
  # ============================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      libraries: ${{ steps.detect.outputs.libraries }}
      has-service-changes: ${{ steps.detect.outputs.has-service-changes }}
      has-library-changes: ${{ steps.detect.outputs.has-library-changes }}
      has-ui-changes: ${{ steps.detect.outputs.has-ui-changes }}
      has-go-workspace-changes: ${{ steps.detect.outputs.has-go-workspace-changes }}
      has-workflow-changes: ${{ steps.detect.outputs.has-workflow-changes }}
      deploy-only: ${{ steps.detect.outputs.deploy-only }}
      has-guard-tooling-changes: ${{ steps.detect.outputs.has-guard-tooling-changes }}
      all-go-services: ${{ steps.detect.outputs.all-go-services }}
      all-go-libraries: ${{ steps.detect.outputs.all-go-libraries }}
      go-services-matrix: ${{ steps.detect.outputs.go-services-matrix }}
      go-libraries-matrix: ${{ steps.detect.outputs.go-libraries-matrix }}
      docker-services-matrix: ${{ steps.detect.outputs.docker-services-matrix }}
      mode: ${{ steps.detect.outputs.mode }}
      override-services: ${{ steps.detect.outputs.override-services }}
      mode-reason: ${{ steps.detect.outputs.mode-reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          force-all: ${{ github.event.inputs.force-all }}

  # ============================================
  # Go Analyzer Guards
  #
  # One job carrying all four go/analysis guards:
  #   rediskeyguard      raw go-redis keyed commands outside libs/atlas-redis
  #                      (FR-1.5, task-045)
  #   outboxguard        producer.ProviderImpl inside a DB transaction closure,
  #                      directly or through a concrete (statically-resolvable)
  #                      helper call. Interface-dispatched emits are the DI seam
  #                      and out of scope. Must route through atlas-outbox so
  #                      the Kafka enqueue is atomic with the domain write
  #                      (task-114 outbox adoption).
  #   goroutineguard     bare go statements outside libs/atlas-routine or a
  #                      justified //goroutine-guard:allow marker (RR-6,
  #                      task-115)
  #   buffdurationguard  seconds→ms scaling in a COMMAND_TOPIC_CHARACTER_BUFF
  #                      duration field (task-190 FR-3.2)
  #
  # These were four separate jobs until they became the slowest thing on a
  # docs-only PR. Run 31889679664 changed six files — three .claude/*.md,
  # CLAUDE.md, docs/verification.md and tools/verify.sh, zero Go — and the four
  # guards burned 376s, 384s, 359s and 285s while every test job correctly
  # skipped. That was the entire 7-minute run. Three things were wrong:
  #
  #   1. The gate. `deploy-only != 'true'` is true for any change set that
  #      isn't confined to deploy/ — including one with no Go in it at all. The
  #      gate is now the affected-module matrices, the same signal lint-go
  #      already used to skip that run correctly, plus has-guard-tooling-changes
  #      so a change to an analyzer itself still forces a full sweep.
  #
  #   2. The cache. `actions/setup-go` defaults to cache: true but looks for
  #      go.sum in the working directory. This is a go.work repo with 85
  #      per-module go.sum files and none at the root, so every one of these
  #      jobs logged "Restore cache failed: Dependencies file is not found" and
  #      ran with a cold GOMODCACHE *and* a cold GOCACHE. The whole reason the
  #      guards drive `go vet -vettool=` is that the go command caches analysis
  #      facts per package in GOCACHE — that optimization had never once taken
  #      effect in CI. cache-dependency-path fixes it.
  #
  #   3. The duplication. Four runners each cold-compiled the same dependency
  #      graph to analyze the same 64 modules. Type-checking, not analysis, is
  #      where the time went. tools/go-analyzer-guards.sh links every analyzer
  #      into one unitchecker binary, so the tree is type-checked once and the
  #      marginal cost of guards 2..4 is near zero.
  #
  # What each guard DETECTS and what each guard SCANS are both unchanged; see
  # tools/atlasguards/guards.go for the services-only vs services+libs split.
  # ============================================
  go-analyzer-guards:
    name: Go Analyzer Guards
    # Input surface is services/**, libs/** and the analyzers' own source under
    # tools/. A change set confined to deploy/ — or to docs, or to .claude/ —
    # cannot alter this verdict.
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.go-services-matrix != '[]' ||
      needs.detect-changes.outputs.go-libraries-matrix != '[]' ||
      needs.detect-changes.outputs.has-guard-tooling-changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Without this the restore silently no-ops: setup-go looks for go.sum
          # in the working directory and this repo has none at the root. Naming
          # the per-module sums plus go.work.sum keys the cache on the actual
          # dependency set, so GOMODCACHE and GOCACHE both come back warm and
          # `go vet -vettool=`'s per-package fact cache does its job.
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Scope the sweep to affected modules
        id: scope
        env:
          SERVICES: ${{ needs.detect-changes.outputs.go-services-matrix }}
          GUARD_TOOLING: ${{ needs.detect-changes.outputs.has-guard-tooling-changes }}
        run: |
          set -euo pipefail
          # A change to an analyzer, its shared driver, or a guard wrapper moves
          # the verdict on code that did not change — sweep everything.
          if [ "$GUARD_TOOLING" = "true" ]; then
            echo "guard tooling changed — full services/ sweep"
            echo "service-modules=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Otherwise the affected-module matrix is the scope. It is the
          # changed services plus everything cideps says depends on them, which
          # is what these analyzers need: outboxguard in particular propagates
          # facts across module boundaries, so a libs/ edit can flip a verdict
          # in a service whose own source never moved. cideps already fans a
          # libs/ change out to its dependents.
          MODULES=$(jq -r --arg ws "$GITHUB_WORKSPACE" \
            '.[] | $ws + "/" + .module_path' <<<"$SERVICES")
          echo "Scoped services/ sweep to $(wc -l <<<"$MODULES") module(s)"
          {
            echo "service-modules<<EOF"
            echo "$MODULES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: go analyzer guards
        env:
          # services/ is scoped to the affected set; libs/ is deliberately left
          # unscoped. .github/config/services.json lists 9 of the 22 Go modules
          # under libs/, so scoping that pass to the libraries matrix would drop
          # 13 modules from goroutineguard and buffdurationguard coverage. The
          # libs modules are small and the services pass has already warmed
          # them in GOCACHE.
          GUARD_SERVICE_MODULES: ${{ steps.scope.outputs.service-modules }}
        run: ./tools/go-analyzer-guards.sh

  # ============================================
  # NPC Shop Contract Mirror Guard
  # Diffs the COMMAND_TOPIC_NPC_SHOP / EVENT_TOPIC_NPC_SHOP_STATUS contract
  # across its three separate-module copies (atlas-npc-shops owner,
  # atlas-channel and atlas-saga-orchestrator mirrors). A field name or json
  # tag changed in one copy and not the others fails no build — it decodes
  # into a zero-valued body at runtime, silently. task-221.
  # ============================================
  npc-shop-contract-mirror-guard:
    name: NPC Shop Contract Mirror Guard
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy-only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: npc-shop contract mirror guard
        run: ./tools/npc-shop-contract-mirror-guard.sh

  # ============================================
  # NPC Conversation Contract Mirror Guard
  # Diffs the COMMAND_TOPIC_NPC / EVENT_TOPIC_NPC_CONVERSATION_STATUS contract
  # across its two separate-module copies (atlas-npc-conversations owner,
  # atlas-saga-orchestrator mirror). A field name or json tag changed in one
  # copy and not the other fails no build — it decodes into a zero-valued
  # body at runtime, silently. task-230.
  # ============================================
  npc-conversation-contract-mirror-guard:
    name: NPC Conversation Contract Mirror Guard
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy-only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: npc-conversation contract mirror guard
        run: ./tools/npc-conversation-contract-mirror-guard.sh

  # LB Port Drift Guard
  # Regenerates the per-version login/channel LB
  # socket port manifests from versions.json and
  # fails if the checked-in manifests have drifted
  # (task-084). Pure shell + jq, no Go setup.
  #
  # Deliberately NOT gated on deploy-only: its inputs
  # (deploy/k8s/base/versions.json, atlas-{login,channel}.yaml)
  # live under deploy/, so a deploy-only change set is exactly
  # when it can catch drift.
  # ============================================
  gen-lb-ports:
    name: LB Port Drift Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: LB port manifests match versions.json
        run: ./tools/gen-lb-ports.sh --check

      - name: Version coverage matches templates
        run: ./tools/check-version-coverage.sh

  # ============================================
  # Tenant Tables Drift Guard
  # Regenerates the per-tenant Postgres table
  # manifest consumed by the sparse-environment
  # orphan sweeper from the source-of-truth audit
  # and fails if the checked-in manifest
  # (services/atlas-pr-bootstrap/scripts/tenant-tables.txt)
  # has drifted (task-232 Task 49).
  #
  # Deliberately NOT gated on deploy-only: its inputs
  # include deploy/k8s/base/atlas-*.yaml (which services
  # are deployed), so a deploy-only change set is exactly
  # when it can catch drift.
  # ============================================
  gen-tenant-tables:
    name: Tenant Tables Drift Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tenant tables manifest matches audit
        run: ./tools/gen-tenant-tables.sh --check

      - name: Tenant tables generator tests
        run: ./tools/gen-tenant-tables_test.sh

  # ============================================
  # Mode Select Decision Table Guard
  # Runs tools/mode-select_test.sh — the FR-9.3
  # escalation-table decision cases (including the
  # unmatched-root-file / go.work / docker-bake.hcl
  # escalation cases) for tools/mode-select.sh, the
  # script detect-changes' "Compute mode" step calls
  # to pick sparse vs. isolated (task-232 Task 50).
  #
  # Deliberately NOT gated on deploy-only: mode-select.sh's
  # own escalation table is what decides whether a
  # deploy-only change even runs the sparse-vs-isolated
  # split correctly, so a deploy-only change set is
  # exactly when this needs to run too.
  # ============================================
  mode-select:
    name: Mode Select Decision Table Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mode select decision table tests
        run: ./tools/mode-select_test.sh

      - name: Shellcheck tools/mode-select.sh
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=error tools/mode-select.sh tools/mode-select_test.sh
          else
            echo "shellcheck not available on this runner image — skipping (no install step added)."
          fi

  # ============================================
  # Ephemeral Environment Mode Report (FR-9.7)
  #
  # Posts (and, on later pushes to the same PR, updates in place) a single
  # PR comment naming the chosen mode, the override set, and the reason —
  # so a reviewer can see the sparse-vs-isolated decision (and whether it
  # was forced by the atlas:sparse/atlas:isolated label, FR-9.5) without
  # opening the detect-changes job summary. Gated only on the event being
  # a pull_request — the mode is computed for every PR, deploy-env label
  # or not, so the report is too.
  # ============================================
  mode-report:
    name: Ephemeral Environment Mode Report
    needs: detect-changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post or update mode report comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MODE: ${{ needs.detect-changes.outputs.mode }}
          REASON: ${{ needs.detect-changes.outputs.mode-reason }}
          OVERRIDES: ${{ needs.detect-changes.outputs.override-services }}
        run: |
          set -euo pipefail
          MARKER="<!-- atlas:mode-report -->"

          TOTAL_WORKLOADS=$(ls deploy/k8s/base/*.yaml 2>/dev/null | wc -l | tr -d ' ')

          if [ "$MODE" = "sparse" ]; then
            OVERRIDE_COUNT=$(printf '%s\n' "$OVERRIDES" | tr ' ' '\n' | grep -c . || true)
            WORKLOADS_LINE="$OVERRIDE_COUNT of $TOTAL_WORKLOADS"
            OVERRIDE_LIST=$(printf '%s\n' "$OVERRIDES" | tr ' ' '\n' | grep . | sed 's/^/`/;s/$/`/' | paste -sd, - | sed 's/,/, /g')
            OVERRIDE_LINE="$OVERRIDE_LIST"
            OTHER_LINE="served by \`main\`"
            CHANGE_LINE="Change the mode with the \`atlas:isolated\` label."
          else
            WORKLOADS_LINE="$TOTAL_WORKLOADS of $TOTAL_WORKLOADS"
            OVERRIDE_LINE="n/a — isolated deploys every service"
            OTHER_LINE="n/a"
            CHANGE_LINE="Change the mode with the \`atlas:sparse\` label."
          fi

          BODY=$(printf '%s\n### Ephemeral environment: **%s**\n\n| | |\n|---|---|\n| Mode | `%s` |\n| Reason | %s |\n| Workloads deployed | %s |\n| Override set | %s |\n| Everything else | %s |\n\n%s\n' \
            "$MARKER" "$MODE" "$MODE" "$REASON" "$WORKLOADS_LINE" "$OVERRIDE_LINE" "$OTHER_LINE" "$CHANGE_LINE")

          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\")) | .id] | first // empty")

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$BODY" >/dev/null
            echo "Updated existing mode report comment $COMMENT_ID"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
            echo "Posted new mode report comment"
          fi

  # ============================================
  # atlas-constants Generator Drift Guard
  # Regenerates the identity/semantics/registry Go
  # sources from identities.yaml + the per-version
  # semantics/availability manifests and fails if
  # the checked-in generated files
  # (skill/job identities_gen.go, every
  # version_*_gen.go, constants/registry_gen.go,
  # skill/job baseline_gen.go) have drifted
  # (task-187 Task 7). gen/drift_test.go is the
  # go-test-level twin of this same check; this job
  # is the belt-and-suspenders CI-level guard
  # `go test` alone can miss if the generator and
  # the checked-in output drift together.
  # ============================================
  atlas-constants-drift-guard:
    name: atlas-constants Generator Drift Guard
    # Input surface is libs/atlas-constants/ only (identities.yaml, the
    # per-version semantics/availability manifests, the generator, and its
    # checked-in output) — a change set confined to deploy/ cannot alter
    # this verdict. See detect-changes' deploy-only output.
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy-only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: atlas-constants generator drift check
        run: |
          set -euo pipefail
          cd libs/atlas-constants/gen
          go run .
          cd ../../../
          git diff --exit-code libs/atlas-constants

  # ============================================
  # Lint & Format Guard (task-171)
  # tools/lint.sh --check is the single source of
  # truth; these jobs mirror it in CI. Formatting
  # is enforced tree-wide on the changed modules;
  # lint findings are gated to new code via
  # --new-from-rev (burn-down: docs/TODO.md).
  # Fail closed: a missing tool or script error
  # fails the job, never a silent pass.
  # ============================================
  lint-go:
    name: Lint & Format Guard (Go)
    needs: detect-changes
    if: needs.detect-changes.outputs.go-services-matrix != '[]' || needs.detect-changes.outputs.go-libraries-matrix != '[]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: lint.sh needs the merge base for --new-from-rev.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Same silent no-op the analyzer guards hit: setup-go looks for go.sum
          # in the working directory, this repo has none at the root, and the
          # restore failed with "Dependencies file is not found" on every run.
          # This job lints up to 63 modules from a cold GOMODCACHE/GOCACHE and
          # is the longest single job in a full PR run (1045s on run
          # 31845173943) — golangci-lint type-checks every package it lints, so
          # a warm build cache is most of the cost.
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Cache lint tooling
        uses: actions/cache@v4
        with:
          path: |
            .cache/golangci-lint
            .cache/tools/bin
          key: lint-tools-${{ runner.os }}-${{ hashFiles('tools/lint.versions') }}

      - name: Lint & format guard (Go)
        env:
          SERVICES: ${{ needs.detect-changes.outputs.go-services-matrix }}
          LIBRARIES: ${{ needs.detect-changes.outputs.go-libraries-matrix }}
        run: |
          set -euo pipefail
          mapfile -t MODULES < <({ jq -r '.[].module_path' <<<"$SERVICES"; jq -r '.[].module_path' <<<"$LIBRARIES"; })
          echo "Linting ${#MODULES[@]} changed module(s)"
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            BASE="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
            ./tools/lint.sh --check --go --base "$BASE" "${MODULES[@]}"
          else
            ./tools/lint.sh --check --go "${MODULES[@]}"
          fi

  lint-ui:
    name: Lint & Format Guard (UI)
    needs: detect-changes
    if: needs.detect-changes.outputs.has-ui-changes == 'true' || needs.detect-changes.outputs.has-workflow-changes == 'true' || github.event.inputs.force-all == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: services/atlas-ui/package-lock.json

      - name: Install dependencies
        working-directory: services/atlas-ui
        run: npm ci

      - name: Lint & format guard (UI)
        run: ./tools/lint.sh --check --ui

  # ============================================
  # Service Registration Guard
  # Cross-checks every hand-maintained list a
  # service must be registered in (docker-bake,
  # go.work, k8s base + both overlays, DB lists,
  # configmap key parity, patch container names).
  # See docs/adding-a-new-service.md. Pure
  # shell + python3, no Go setup.
  #
  # Deliberately NOT gated on deploy-only: it reads
  # deploy/k8s/overlays/main/kustomization.yaml, which is the
  # file the automated main-overlay bump PR rewrites. This is
  # the one guard that can catch a bump dropping or mangling an
  # image entry.
  # ============================================
  service-registration-guard:
    name: Service Registration Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: service registration guard
        run: ./tools/service-registration-guard.sh

  # ============================================
  # Parse-checks and shellchecks every tools/**/*.sh.
  # Before this job the repo's shell tooling had no
  # gate at all: verify.sh's only shell check was
  # hardcoded to tools/task-(resolve|brief).sh, so a
  # branch adding three tools/ scripts saw all 14
  # checks skip and still exited 0.
  # Ungated and pure shell — the whole sweep is
  # ~1s, so path filtering would cost more than it
  # saves. --require-shellcheck makes a runner
  # without shellcheck a failure rather than a
  # silent downgrade to syntax-only.
  # ============================================
  shell-tooling-guard:
    name: Shell Tooling Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shell tooling guard
        run: ./tools/shell-guard.sh --require-shellcheck

  # ============================================
  # Enforces ascending opCode order for the
  # handlers/writers arrays in every tenant
  # socket-config template. See
  # docs/packets/TEMPLATE_CONVENTIONS.md.
  # Pure shell + python3, no Go setup.
  # ============================================
  template-opcode-order-guard:
    name: Template Opcode Order Guard
    # Input surface is services/atlas-configurations/seed-data/templates/
    # only — a change set confined to deploy/ cannot alter this verdict.
    # See detect-changes' deploy-only output.
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy-only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: template opcode order guard
        run: ./tools/template-opcode-order-guard.sh

  # ============================================
  # Enforces that every MOVE handler in every
  # tenant socket-config template carries a
  # well-formed, template-consistent movement
  # `types` table. A missing or typo'd entry
  # silently degrades that element to a 3-byte
  # decode and desyncs the packet. See
  # docs/packets/TEMPLATE_CONVENTIONS.md.
  # Pure shell + python3, no Go setup.
  # ============================================
  template-movement-types-guard:
    name: Template Movement Types Guard
    # Input surface is services/atlas-configurations/seed-data/templates/
    # only — a change set confined to deploy/ cannot alter this verdict.
    # See detect-changes' deploy-only output.
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy-only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: template movement types guard
        run: ./tools/template-movement-types-guard.sh

  # ============================================
  # Skill/Job Id Guard
  # Bans raw comparisons against the job/skill
  # "…Id" wire constants that task-187's audit
  # identified as version-divergent (e.g.
  # job.GmId (500) is Gm at v0.48 but Pirate at
  # v0.61+) outside the version-aware resolver.
  # Banned const list is derived from
  # docs/tasks/task-187-version-aware-id-semantics/
  # audit/divergences.csv, so it grows with the
  # audit (OQ-6). Pure shell + python3, no Go
  # setup.
  # ============================================
  skill-job-id-guard:
    name: Skill/Job Id Guard
    # Input surface is services/**/*.go + libs/**/*.go only — a change set
    # confined to deploy/ (the automated main-overlay bump PR) cannot alter
    # this verdict. See detect-changes' deploy-only output.
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy-only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: skill/job id guard
        run: ./tools/skill-job-id-guard.sh

  # ============================================
  # Test Go Libraries
  # ============================================
  test-go-libraries:
    name: Test Library - ${{ matrix.library.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.go-libraries-matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        library: ${{ fromJson(needs.detect-changes.outputs.go-libraries-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        uses: ./.github/actions/go-test
        with:
          working-directory: ${{ matrix.library.module_path }}
          go-version: ${{ env.GO_VERSION }}
          race-detection: 'true'
          coverage: 'true'
          coverage-threshold: ${{ matrix.library.coverage_threshold }}

  # ============================================
  # Test Go Services
  # ============================================
  test-go-services:
    name: Test Service - ${{ matrix.service.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.go-services-matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.go-services-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        uses: ./.github/actions/go-test
        with:
          working-directory: ${{ matrix.service.module_path }}
          go-version: ${{ env.GO_VERSION }}

  # ============================================
  # Test UI Service
  # ============================================
  test-ui:
    name: Test UI
    needs: detect-changes
    if: needs.detect-changes.outputs.has-ui-changes == 'true' || needs.detect-changes.outputs.has-workflow-changes == 'true' || github.event.inputs.force-all == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests and build
        uses: ./.github/actions/node-test
        with:
          working-directory: services/atlas-ui
          node-version: ${{ env.NODE_VERSION }}

  # ============================================
  # Build Docker Images (bake — sharded matrix)
  #
  # Always runs Dockerfile validation; pushes to ghcr only when the PR
  # carries the `deploy-env` label. The full set of services to build
  # is sourced from detect-changes.outputs.docker-services-matrix and
  # split into 4 round-robin shards so each shard runs on its own
  # ubuntu-latest runner (restoring most of the parallelism that the
  # original per-service matrix had, while keeping the one-Dockerfile +
  # bake architecture). The per-PR tag (pr-<N>-<sha> when push=true,
  # pr-<N>/pr-dispatch otherwise) is computed once per shard and applied
  # to that shard's targets.
  # ============================================
  build-docker:
    name: Build Docker (bake — shard ${{ matrix.shard }}/3)
    needs: [detect-changes, test-go-services, test-go-libraries, test-ui]
    if: |
      always() &&
      needs.detect-changes.outputs.docker-services-matrix != '[]' &&
      (needs.test-go-services.result == 'success' || needs.test-go-services.result == 'skipped') &&
      (needs.test-go-libraries.result == 'success' || needs.test-go-libraries.result == 'skipped') &&
      (needs.test-ui.result == 'success' || needs.test-ui.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "short=$(git rev-parse --short=7 "$SHA")" >> $GITHUB_OUTPUT

      - name: Compute push flag and tag
        id: pushtag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          HAS_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-env') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tag=pr-${PR_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            if [ "$IS_PR" = "true" ]; then
              echo "tag=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            else
              echo "tag=pr-dispatch" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Derive bake inputs for this shard
        id: bake-inputs
        env:
          MATRIX_JSON: ${{ needs.detect-changes.outputs.docker-services-matrix }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Round-robin assignment: shard S gets indices where (index % 4) == S.
          # Round-robin (vs contiguous slicing) spreads alphabetically-clustered
          # build-time outliers evenly across shards.
          TARGETS=$(echo "$MATRIX_JSON" | jq -c --argjson s "$SHARD" \
            '[to_entries[] | select(.key % 4 == $s) | .value.name]')
          # image-name-map is the full map; the action looks up only the shard's targets.
          IMAGE_MAP=$(echo "$MATRIX_JSON" | jq -c 'map({(.name): .docker_image}) | add')
          echo "targets=$TARGETS"          >> "$GITHUB_OUTPUT"
          echo "image-name-map=$IMAGE_MAP" >> "$GITHUB_OUTPUT"
          echo "Shard ${SHARD} got $(echo "$TARGETS" | jq 'length') target(s)"

      - name: Build Docker images (bake)
        if: steps.bake-inputs.outputs.targets != '[]'
        uses: ./.github/actions/docker-build
        with:
          targets: ${{ steps.bake-inputs.outputs.targets }}
          image-name-map: ${{ steps.bake-inputs.outputs.image-name-map }}
          tags: ${{ steps.pushtag.outputs.tag }}
          push: ${{ steps.pushtag.outputs.push }}
          platform: linux/amd64
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_TOKEN }}
          # v2: rotated 2026-07-14 to purge a poisoned type=gha layer that kept
          # restoring a stale atlas-channel compile (correct source, stale binary
          # — the include=listings fix never reached the built image; task-127).
          cache-scope: atlas-bake-amd64-v2-shard${{ matrix.shard }}

  # ============================================
  # PR-env resolved overlay (bot branch)
  #
  # After build-docker completes, create/update a derived branch
  # `bot/pr-<N>-resolved` that:
  #   1. Substitutes every PLACEHOLDER_ATLAS_ENV / PLACEHOLDER_PR_NUMBER /
  #      PLACEHOLDER_FULL_SHA token in the mode-selected main overlay
  #      (deploy/k8s/overlays/pr/ for isolated/full, pr-sparse/ for sparse)
  #      AND deploy/k8s/overlays/pr-cleanup/ with the actual per-PR value
  #      (sed across both directories).
  #   1b. In sparse mode, relocates the resolved pr-sparse/ onto
  #      deploy/k8s/overlays/pr/ before staging, because the out-of-repo
  #      ApplicationSet hard-codes that path (see the Force-push step).
  #   2. Bumps deploy/k8s/overlays/pr/kustomization.yaml's `images:` block
  #      so only the just-built services point at pr-<N>-<sha>; unchanged
  #      services keep `newTag: latest` (which option-b's main-publish
  #      flow now keeps fresh under :latest manifest list).
  #   3. Force-pushes to bot/pr-<N>-resolved.
  #
  # The Argo ApplicationSet uses multi-source mode and targets
  # bot/pr-<N>-resolved (not the PR head directly), with two `sources:`
  # entries — one for each overlay. Kustomize sees already-resolved
  # overlays with no placeholders. This sidesteps kustomize's
  # substring-substitution limitations on the bracketed
  # KAFKA_CONSUMER_GROUP form and the variable-dash DB_NAME form.
  #
  # The pr-cleanup/ overlay is intentionally separate because the
  # PostDelete cleanup Job lives in `argocd` namespace, not atlas-pr-<N>
  # (see pr-cleanup/kustomization.yaml header + task-070/design.md §3.1).
  #
  # GITHUB_TOKEN is used intentionally: its pushes do NOT trigger
  # downstream workflow runs, which is exactly what we want — the bot
  # commit must not re-trigger pr-validation.yml on the bot branch
  # (infinite loop), and we don't need PR checks to run on bot branches.
  # ============================================
  update-pr-overlay:
    name: Resolve PR overlay
    needs: [detect-changes, build-docker]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'deploy-env') &&
      needs.build-docker.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN is intentional — see header comment.
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install yq
        run: |
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Compute per-PR tokens
        id: tokens
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # ATLAS_ENV must match the ApplicationSet's computation:
          #   sha256("pr-<N>")[:4]
          ATLAS_ENV=$(printf "pr-%d" "$PR_NUMBER" | sha256sum | cut -c1-4)
          SHORT_SHA=$(git rev-parse --short=7 "$HEAD_SHA")
          echo "atlas_env=$ATLAS_ENV" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Tokens: ATLAS_ENV=$ATLAS_ENV PR_NUMBER=$PR_NUMBER SHA=$SHORT_SHA"

      - name: Resolve baseline environment
        id: baseline
        run: |
          set -euo pipefail
          # PLACEHOLDER_BASELINE_NAMESPACE / PLACEHOLDER_BASELINE_ENVIRONMENT
          # must never be a hard-coded "atlas-main" / "main" literal here
          # (FR-1.5). There is no network path from this GH-hosted runner to
          # the live cluster's atlas-configurations (update-pr-overlay runs
          # on ubuntu-latest, not the [self-hosted, atlas-cluster] runner
          # .github/workflows/pr-env-smoke.yml uses), so the ACTIVE baseline
          # environment record's two fields are derived mechanically from
          # committed data, rather than queried live:
          #   BASELINE_OVERLAY   — deploy/k8s/BASELINE_OVERLAY, the single
          #     declared home for "which overlays/<name>/ is the baseline"
          #     (FR-1.5: repointing the baseline is a one-line data change
          #     there, never a code change in this workflow).
          #   BASELINE_NAMESPACE — deploy/k8s/overlays/$BASELINE_OVERLAY/
          #     kustomization.yaml's own `namespace:` field.
          #   BASELINE_ENVIRONMENT — derived from BASELINE_NAMESPACE by
          #     stripping the `atlas-` prefix, the same namespace<->env.Id
          #     convention every other environment uses (atlas-pr-<N> <-> pr-<N>).
          #     This convention is assumed, not independently verified per
          #     environment — it is currently true for every overlay in the repo.
          BASELINE_OVERLAY=$(head -1 deploy/k8s/BASELINE_OVERLAY | tr -d '[:space:]')
          if [ -z "$BASELINE_OVERLAY" ]; then
            echo "::error::deploy/k8s/BASELINE_OVERLAY is empty" >&2
            exit 1
          fi
          BASELINE_KUSTOMIZATION="deploy/k8s/overlays/${BASELINE_OVERLAY}/kustomization.yaml"
          BASELINE_NAMESPACE=$(sed -n 's/^namespace: *//p' "$BASELINE_KUSTOMIZATION" | head -1)
          if [ -z "$BASELINE_NAMESPACE" ]; then
            echo "::error::could not resolve namespace: from $BASELINE_KUSTOMIZATION" >&2
            exit 1
          fi
          BASELINE_ENVIRONMENT="${BASELINE_NAMESPACE#atlas-}"
          echo "baseline_namespace=$BASELINE_NAMESPACE" >> "$GITHUB_OUTPUT"
          echo "baseline_environment=$BASELINE_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "Baseline: environment=$BASELINE_ENVIRONMENT namespace=$BASELINE_NAMESPACE"

      - name: Substitute placeholders in PR overlay
        env:
          MODE: ${{ needs.detect-changes.outputs.mode }}
          OVERRIDE_SERVICES: ${{ needs.detect-changes.outputs.override-services }}
          ATLAS_ENV: ${{ steps.tokens.outputs.atlas_env }}
          PR_NUMBER: ${{ steps.tokens.outputs.pr_number }}
          FULL_SHA: ${{ github.event.pull_request.head.sha }}
          BASELINE_NAMESPACE: ${{ steps.baseline.outputs.baseline_namespace }}
          BASELINE_ENVIRONMENT: ${{ steps.baseline.outputs.baseline_environment }}
        run: |
          set -euo pipefail

          if [ "$MODE" = "sparse" ]; then
            OVERLAY_DIR=deploy/k8s/overlays/pr-sparse
          else
            OVERLAY_DIR=deploy/k8s/overlays/pr
          fi
          echo "Mode: $MODE -> overlay: $OVERLAY_DIR"

          # The three scalar tokens overlays/pr and overlays/pr-sparse share.
          # `|` is a safe sed delimiter for these three — none of
          # PR_NUMBER/ATLAS_ENV/FULL_SHA ever contains `|`.
          find "$OVERLAY_DIR" deploy/k8s/overlays/pr-cleanup \
              -type f \( -name '*.yaml' -o -name '*.yml' \) \
            -exec sed -i \
              -e "s|PLACEHOLDER_ATLAS_ENV|${ATLAS_ENV}|g" \
              -e "s|PLACEHOLDER_PR_NUMBER|${PR_NUMBER}|g" \
              -e "s|PLACEHOLDER_FULL_SHA|${FULL_SHA}|g" \
              -e "s|PLACEHOLDER_BASELINE_NAMESPACE|${BASELINE_NAMESPACE}|g" \
              -e "s|PLACEHOLDER_BASELINE_ENVIRONMENT|${BASELINE_ENVIRONMENT}|g" \
              {} +

          if [ "$MODE" = "sparse" ]; then
            # override-services (space-separated, from tools/mode-select.sh
            # via detect-changes) is the set of services deployed LOCALLY in
            # this sparse namespace, plus atlas-ingress (always local — the
            # routing mechanism itself, never part of mode-select.sh's set;
            # see pr-sparse/README.md "The override set").
            KEEP=" $OVERRIDE_SERVICES atlas-ingress "

            # PLACEHOLDER_OVERRIDES_JSON — single-line JSON object,
            # {"<svc>":"<this-env-namespace>", ...} for every override-set
            # service EXCEPT atlas-ingress (environment-record.yaml's
            # `overrides` attribute; see that file's header). Namespace here
            # is this env's OWN namespace (atlas-pr-<N>), not the baseline's.
            OVERRIDES_JSON=$(printf '%s\n' $OVERRIDE_SERVICES | awk 'NF' | \
              jq -R -s --arg ns "atlas-pr-${PR_NUMBER}" \
                '[splits("\n") | select(length>0)] | map({(.): $ns}) | add // {}' -c)

            # PLACEHOLDER_DELETE_BLOCK — one `$patch: delete` kustomize
            # patches-list entry per base Deployment NOT in the override
            # set. detect-changes' all-go-services is services.json's
            # go-service list, which is NOT the base Deployment set — it
            # includes two services with no base Deployment yet
            # (atlas-families, atlas-marriages). tools/mode-select.sh's
            # override set is the union of go-affected services and changed
            # non-Go services filtered to those WITH a base Deployment
            # (task-258), so atlas-ui belongs in KEEP whenever it changed —
            # this loop's own base-Deployment enumeration already reflects
            # that; only all-go-services (used elsewhere in this workflow)
            # still diverges from the base Deployment set. Enumerate actual
            # base Deployment names directly instead — verified against
            # services.json's list during Task 50 review; the discrepancy
            # would otherwise produce a kustomize build error ("no resource
            # matches strategic merge patch") for either stale name.
            DELETE_BLOCK=""
            while IFS= read -r svc; do
              [ -z "$svc" ] && continue
              case "$KEEP" in
                *" $svc "*) continue ;;
              esac
              DELETE_BLOCK="${DELETE_BLOCK}$(printf '\\\n  - patch: |-\\\n      $patch: delete\\\n      apiVersion: apps/v1\\\n      kind: Deployment\\\n      metadata:\\\n        name: %s' "$svc")"
            done < <(yq eval-all 'select(tag == "!!map") | select(.kind == "Deployment") | .metadata.name' deploy/k8s/base/*.yaml | grep -v '^---$')

            # PLACEHOLDER_NS_OVERRIDES — one `- name: NS_<SVC>` /
            # `value: <baseline namespace>` pair per NS_* variable
            # (deploy/k8s/base/ns-vars.generated.yaml) whose service is NOT
            # in the override set. atlas-login/atlas-channel have no NS_*
            # entry at all (own LB Services, never nginx-routed) — see
            # ns-overrides.yaml's header.
            NS_OVERRIDES=""
            while IFS= read -r nsvar; do
              [ -z "$nsvar" ] && continue
              svc=$(printf '%s' "$nsvar" | sed -e 's/^NS_//' | tr '[:upper:]' '[:lower:]' | tr '_' '-')
              case "$KEEP" in
                *" $svc "*) continue ;;
              esac
              NS_OVERRIDES="${NS_OVERRIDES}$(printf '\\\n            - name: %s\\\n              value: %s' "$nsvar" "$BASELINE_NAMESPACE")"
            done < <(sed -n 's/^- name: \(NS_[A-Z_]*\)$/\1/p' deploy/k8s/base/ns-vars.generated.yaml)

            # PLACEHOLDER_SERVICE_ID_BLOCK / PLACEHOLDER_PRECREATE_GROUPS_BLOCK
            # (task-243 D1/D2/D6, design §3.2/§6). One pass over the override
            # set derives every override-set Deployment's SERVICE_ID
            # (tools/derive-service-id.sh, the single derivation site) and
            # produces three things from it:
            #   1. a strategic-merge patch pinning that Deployment's own
            #      SERVICE_ID env var to the derived value — this is what
            #      survives Argo's selfHeal, because the value lives in the
            #      manifest Argo renders instead of being minted at runtime;
            #   2. a JSON-6902 entry adding SERVICE_ID_<TYPE> to the
            #      atlas-pr-bootstrap Job, so bootstrap POSTs the id it
            #      rendered rather than re-deriving one itself;
            #   3. the RESOLVED consumer group name for the precreate Job,
            #      read from patches/consumer-group-env.yaml (already
            #      PLACEHOLDER_ATLAS_ENV-substituted by the scalar pass
            #      above). atlas-login/atlas-channel carry a literal "%s"
            #      that libs/atlas-kafka/consumergroup.Resolve fills with
            #      serviceId.String() at runtime — seeding the template
            #      verbatim would create a group no consumer ever joins, so
            #      it is filled here too.
            # GROUP_LIST, not GROUPS: `GROUPS` is bash's own reserved array
            # variable (the caller's group-membership list) — assigning to
            # it is silently ignored, not an error, which would make this
            # loop appear to work while producing an empty precreate patch
            # (confirmed directly: `GROUPS="a"; echo "${#GROUPS}"` -> 0).
            SERVICE_ID_BLOCK=""
            JOB_ENV_OPS=""
            GROUP_LIST=""
            for svc in $OVERRIDE_SERVICES; do
              base="deploy/k8s/base/$svc.yaml"
              [ -f "$base" ] || continue
              # Only the six base Deployments that carry SERVICE_ID participate.
              stype=$(yq eval-all 'select(.kind=="Deployment") | .spec.template.spec.containers[0].env[]
                        | select(.name=="SERVICE_TYPE") | .value' "$base" | head -1)
              [ -n "$stype" ] && [ "$stype" != "null" ] || continue
              cname=$(yq eval-all 'select(.kind=="Deployment") | .spec.template.spec.containers[0].name' "$base" | head -1)
              sid=$(tools/derive-service-id.sh "$stype" "pr-${PR_NUMBER}")
              echo "Derived SERVICE_ID for $svc ($stype): $sid"

              # 1. the Deployment's own SERVICE_ID
              SERVICE_ID_BLOCK="${SERVICE_ID_BLOCK}$(printf '\\\n  - patch: |-\\\n      apiVersion: apps/v1\\\n      kind: Deployment\\\n      metadata:\\\n        name: %s\\\n      spec:\\\n        template:\\\n          spec:\\\n            containers:\\\n              - name: %s\\\n                env:\\\n                  - name: SERVICE_ID\\\n                    value: %s' "$svc" "$cname" "$sid")"

              # 2. the bootstrap Job's SERVICE_ID_<TYPE> (matches
              # services/atlas-pr-bootstrap/scripts/bootstrap.sh's own
              # svc_id_var_name derivation exactly).
              var="SERVICE_ID_$(printf '%s' "$stype" | tr '[:lower:]-' '[:upper:]_')"
              JOB_ENV_OPS="${JOB_ENV_OPS}$(printf '\\\n      - op: add\\\n        path: /spec/template/spec/containers/0/env/-\\\n        value:\\\n          name: %s\\\n          value: %s' "$var" "$sid")"

              # 3. the RESOLVED consumer group name for the precreate Job
              grp=$(yq eval-all 'select(.kind=="Deployment") | select(.metadata.name=="'"$svc"'")
                      | .spec.template.spec.containers[0].env[] | select(.name=="KAFKA_CONSUMER_GROUP") | .value' \
                    deploy/k8s/overlays/pr-sparse/patches/consumer-group-env.yaml | head -1)
              [ -n "$grp" ] && [ "$grp" != "null" ] || continue
              grp=$(printf "$grp" "$sid")
              echo "Resolved consumer group for $svc: $grp"
              GROUP_LIST="${GROUP_LIST}$(printf '\\\n              %s' "$grp")"
            done

            if [ -z "$SERVICE_ID_BLOCK" ]; then
              echo "::error::sparse mode has no SERVICE_ID-carrying override-set Deployment — this environment would bind nothing" >&2
              exit 1
            fi
            if [ -z "$GROUP_LIST" ]; then
              echo "::error::no KAFKA_CONSUMER_GROUP resolved for the override set — activating without seeded offsets is not allowed (FR-4.4)" >&2
              exit 1
            fi
            case "$GROUP_LIST" in
              *%*)
                echo "::error::resolved consumer group list still carries an unfilled %% template — a templated caller's format string was seeded verbatim" >&2
                exit 1
                ;;
            esac

            # Append the bootstrap-Job JSON-6902 patch onto the same token
            # (task-11's comment for PLACEHOLDER_SERVICE_ID_BLOCK documents
            # both patches living under this one token).
            SERVICE_ID_BLOCK="${SERVICE_ID_BLOCK}$(printf '\\\n  - target:\\\n      kind: Job\\\n      name: atlas-pr-bootstrap\\\n    patch: |-')${JOB_ENV_OPS}"

            # `add` targets the whole `env` path, not `env/-`, because
            # deploy/k8s/base/atlas-kafka-precreate.yaml's container has
            # envFrom only, no pre-existing `env:` key — whole-path `add`
            # creates it. If a future commit adds an `env:` key there,
            # this REPLACES it instead of extending it, silently.
            PRECREATE_GROUPS_BLOCK="$(printf '\\\n  - target:\\\n      kind: Job\\\n      name: atlas-kafka-precreate\\\n    patch: |-\\\n      - op: add\\\n        path: /spec/template/spec/containers/0/env\\\n        value:\\\n          - name: KAFKA_CONSUMER_GROUP\\\n            value: |-')${GROUP_LIST}"

            echo "Override set (+ atlas-ingress): $KEEP"

            # The three block payloads can't use `|` as the sed delimiter —
            # DELETE_BLOCK's payload contains a literal `|` from YAML's
            # `|-` block-scalar marker, which would terminate the `s|...|`
            # expression (reproduced in task-44-report.md fix-round-1).
            # OVERRIDES_JSON is safe under `|` today only because service
            # names can't contain `|`/`&`/`\`, but using the same `\x01`
            # delimiter for all three keeps that invariant from ever having
            # to be re-verified here. A control character is guaranteed
            # absent from every payload.
            D=$(printf '\x01')
            find "$OVERLAY_DIR" -type f \( -name '*.yaml' -o -name '*.yml' \) \
              -exec sed -i \
                -e "s${D}PLACEHOLDER_DELETE_BLOCK${D}${DELETE_BLOCK}${D}g" \
                -e "s${D}PLACEHOLDER_NS_OVERRIDES${D}${NS_OVERRIDES}${D}g" \
                -e "s${D}PLACEHOLDER_OVERRIDES_JSON${D}${OVERRIDES_JSON}${D}g" \
                -e "s${D}PLACEHOLDER_SERVICE_ID_BLOCK${D}${SERVICE_ID_BLOCK}${D}g" \
                -e "s${D}PLACEHOLDER_PRECREATE_GROUPS_BLOCK${D}${PRECREATE_GROUPS_BLOCK}${D}g" \
                {} +
          fi

          echo "=== Placeholders remaining (expect none) ==="
          # yaml/yml only — matches the substitution's own file scope. A
          # plain `grep -rn` over the whole directory also matches
          # pr-sparse/README.md, which documents the PLACEHOLDER_ names in
          # prose and is never substituted; that would make this guard
          # fail on every sparse-mode run regardless of fill correctness.
          LEAKS=$(find "$OVERLAY_DIR" deploy/k8s/overlays/pr-cleanup \
              -type f \( -name '*.yaml' -o -name '*.yml' \) \
            -exec grep -n 'PLACEHOLDER_' {} + || true)
          if [ -n "$LEAKS" ]; then
            echo "$LEAKS"
            echo "::error::unfilled PLACEHOLDER_ token(s) survived substitution — see above" >&2
            exit 1
          fi
          echo "(clean)"

          if [ "$MODE" = "sparse" ]; then
            # Offline half of design.md §11's "Rendered-manifest" tests (the
            # overlays/main / overlays/pr byte-identity half lives in Task
            # 7's mirror guard). Renders the just-substituted overlay and
            # checks the SERVICE_ID / consumer-group bindings actually
            # landed where the runtime reads them from, not merely that the
            # PLACEHOLDER_ tokens were replaced with *something*.
            echo "=== Rendering $OVERLAY_DIR to verify SERVICE_ID / KAFKA_CONSUMER_GROUP bindings ==="
            RENDERED=$(mktemp)
            kustomize build "$OVERLAY_DIR" > "$RENDERED"

            for svc in $OVERRIDE_SERVICES; do
              base="deploy/k8s/base/$svc.yaml"
              [ -f "$base" ] || continue
              stype=$(yq eval-all 'select(.kind=="Deployment") | .spec.template.spec.containers[0].env[]
                        | select(.name=="SERVICE_TYPE") | .value' "$base" | head -1)
              [ -n "$stype" ] && [ "$stype" != "null" ] || continue
              base_sid=$(yq eval-all 'select(.kind=="Deployment") | .spec.template.spec.containers[0].env[]
                        | select(.name=="SERVICE_ID") | .value' "$base" | head -1)
              want_sid=$(tools/derive-service-id.sh "$stype" "pr-${PR_NUMBER}")

              rendered_sid=$(yq eval-all 'select(.kind=="Deployment" and .metadata.name=="'"$svc"'")
                        | .spec.template.spec.containers[0].env[] | select(.name=="SERVICE_ID") | .value' "$RENDERED" | head -1)
              if [ "$rendered_sid" != "$want_sid" ]; then
                echo "::error::rendered $svc SERVICE_ID=$rendered_sid, want derived $want_sid" >&2
                exit 1
              fi
              if [ "$rendered_sid" = "$base_sid" ]; then
                echo "::error::rendered $svc SERVICE_ID still matches the base literal $base_sid — PLACEHOLDER_SERVICE_ID_BLOCK did not override it" >&2
                exit 1
              fi

              var="SERVICE_ID_$(printf '%s' "$stype" | tr '[:lower:]-' '[:upper:]_')"
              job_sid=$(yq eval-all 'select(.kind=="Job" and .metadata.name=="atlas-pr-bootstrap")
                        | .spec.template.spec.containers[0].env[] | select(.name=="'"$var"'") | .value' "$RENDERED" | head -1)
              if [ "$job_sid" != "$want_sid" ]; then
                echo "::error::atlas-pr-bootstrap Job $var=$job_sid, want $want_sid" >&2
                exit 1
              fi
              echo "OK: $svc SERVICE_ID=$rendered_sid, atlas-pr-bootstrap $var matches"
            done

            precreate_groups=$(yq eval-all 'select(.kind=="Job" and .metadata.name=="atlas-kafka-precreate")
                      | .spec.template.spec.containers[0].env[] | select(.name=="KAFKA_CONSUMER_GROUP") | .value' "$RENDERED")
            if [ -z "$precreate_groups" ]; then
              echo "::error::atlas-kafka-precreate Job carries no KAFKA_CONSUMER_GROUP after render" >&2
              exit 1
            fi
            case "$precreate_groups" in
              *%*)
                echo "::error::rendered atlas-kafka-precreate KAFKA_CONSUMER_GROUP still contains an unresolved %% template" >&2
                exit 1
                ;;
            esac
            echo "OK: atlas-kafka-precreate KAFKA_CONSUMER_GROUP:"
            echo "$precreate_groups"
            rm -f "$RENDERED"
          fi

      - name: Stamp CATALOG_REVISION (PR)
        run: |
          set -e
          SHA="${{ github.event.pull_request.head.sha }}"
          for dir in deploy/seed/*/*/; do
            printf '%s' "$SHA" > "${dir}CATALOG_REVISION"
          done

      - name: Bump image tags for built services
        env:
          SERVICES_JSON: ${{ needs.detect-changes.outputs.docker-services-matrix }}
          PR_NUMBER: ${{ steps.tokens.outputs.pr_number }}
          SHORT_SHA: ${{ steps.tokens.outputs.short_sha }}
          MODE: ${{ needs.detect-changes.outputs.mode }}
        run: |
          set -euo pipefail
          NEW_TAG="pr-${PR_NUMBER}-${SHORT_SHA}"

          if [ "$MODE" = "sparse" ]; then
            MAIN_OVERLAY=deploy/k8s/overlays/pr-sparse/kustomization.yaml
          else
            MAIN_OVERLAY=deploy/k8s/overlays/pr/kustomization.yaml
          fi

          # The detect-changes matrix is the exact list of services
          # that build-docker pushed pr-<N>-<sha> tags for. For each,
          # bump the corresponding entry in each overlay's `images:`
          # block. Services NOT in this list keep their existing tag
          # (typically `latest` for first-build PRs, or a previous
          # `pr-<N>-<sha>` for subsequent pushes that left unchanged
          # services untouched).
          #
          # Two overlays are kept in sync: the mode-selected main overlay
          # (`pr/` or `pr-sparse/`) and `pr-cleanup/` (the PostDelete
          # cleanup Job). Without the second loop, a PR that rebuilds
          # atlas-pr-bootstrap would still see its cleanup Job pull
          # `:latest` at teardown, masking any bootstrap-script change
          # from the PR's own validation cycle. Only atlas-pr-bootstrap
          # appears in `pr-cleanup/`'s images block today; the yq
          # selector silently skips any service not present, so the same
          # loop is safe to apply to both overlays.
          for OVERLAY in "$MAIN_OVERLAY" \
                         deploy/k8s/overlays/pr-cleanup/kustomization.yaml; do
              while read -r image; do
                  echo "Bumping ${image} → ${NEW_TAG} in ${OVERLAY}"
                  yq -i \
                      "(.images[]? | select(.name == \"${image}\") | .newTag) = \"${NEW_TAG}\"" \
                      "$OVERLAY"
              done < <(echo "$SERVICES_JSON" | jq -r '.[].docker_image')
          done

          echo "=== Resulting images: block (head) ==="
          yq '.images[0:5]' "$OVERLAY"

      - name: Regenerate cluster-infra coordination ConfigMap artifact
        run: |
          set -euo pipefail
          deploy/k8s/overlays/pr/scripts/gen-cleanup-env.sh
          # The output file is checked in. If a service was added or
          # removed since the last regen, this run's output diverges
          # from the committed copy and CI fails — forcing the PR
          # author to commit the regen alongside their services.json
          # change.
          if ! git diff --exit-code dev/cluster-infra-coordination/atlas-pr-cleanup-env.example.yaml; then
              echo '::error::dev/cluster-infra-coordination/atlas-pr-cleanup-env.example.yaml is stale. Run deploy/k8s/overlays/pr/scripts/gen-cleanup-env.sh and commit the result.' >&2
              exit 1
          fi

      - name: Force-push bot/pr-<N>-resolved
        env:
          PR_NUMBER: ${{ steps.tokens.outputs.pr_number }}
          SHORT_SHA: ${{ steps.tokens.outputs.short_sha }}
          MODE: ${{ needs.detect-changes.outputs.mode }}
        run: |
          set -euo pipefail
          BRANCH="bot/pr-${PR_NUMBER}-resolved"
          git config user.name 'atlas-image-bot'
          git config user.email 'atlas-image-bot@users.noreply.github.com'

          # Argo CD's ApplicationSet(atlas-pr) hard-codes
          # `path: deploy/k8s/overlays/pr` for its main source, and it lives
          # in cluster-infra — outside this repo, so no in-repo guard can
          # see it. Sparse mode therefore CANNOT publish its resolved output
          # under `pr-sparse/`: Argo would render the untouched `pr/`, whose
          # `namespace: atlas-pr-PLACEHOLDER_PR_NUMBER` is not a valid
          # RFC 1123 label, and the sync retry-loops forever having created
          # nothing (observed on PR #1411, the first sparse-mode PR).
          #
          # Instead the mode-selected overlay is published AT the fixed path
          # the ApplicationSet already expects. The bot branch is generated
          # and disposable, so relocating a directory on it costs nothing and
          # keeps the mode decision entirely in this workflow. `pr-sparse/`
          # and `pr/` sit at the same depth, so the shared `../../base`
          # resource reference resolves identically after the move.
          #
          # This must run AFTER the CATALOG_REVISION stamp, the image-tag
          # bump, and gen-cleanup-env.sh — the last of those reads
          # `deploy/k8s/overlays/pr/scripts/`, which sparse mode does not
          # carry and which the move removes.
          if [ "$MODE" = "sparse" ]; then
            rm -rf deploy/k8s/overlays/pr
            mv deploy/k8s/overlays/pr-sparse deploy/k8s/overlays/pr
          fi

          # The substitution step's leak guard only ever scanned the
          # mode-selected source directory, which is why a fully-resolved
          # `pr-sparse/` reported clean while the `pr/` Argo actually
          # rendered was still full of placeholders. Re-check the published
          # path — the one thing Argo reads — after the move.
          LEAKS=$(find deploy/k8s/overlays/pr deploy/k8s/overlays/pr-cleanup \
              -type f \( -name '*.yaml' -o -name '*.yml' \) \
            -exec grep -n 'PLACEHOLDER_' {} + || true)
          if [ -n "$LEAKS" ]; then
            echo "$LEAKS"
            echo "::error::unfilled PLACEHOLDER_ token(s) in the published overlay — Argo would render these verbatim" >&2
            exit 1
          fi

          # Stage the resolved overlays (published `pr/` + `pr-cleanup`) +
          # bumped image tags + stamped CATALOG_REVISION. `-A` is required:
          # sparse mode's move deletes `pr-sparse/` and rewrites `pr/`, and
          # a plain `git add <path>` would not stage the removals.
          git add -A deploy/k8s/overlays deploy/seed

          if git diff --cached --quiet; then
              echo "::warning::No changes to commit — PR overlay was already resolved? Skipping force-push."
              exit 0
          fi

          # Create/reset the bot branch from the current PR head with our
          # substitutions on top. Force-push to overwrite any prior bot
          # branch for this PR (each new PR push starts fresh).
          git checkout -b "$BRANCH"
          git commit -m "chore(pr-overlay): resolve placeholders for PR #${PR_NUMBER} at ${SHORT_SHA}

          Auto-generated by pr-validation.yml. Argo ApplicationSet(atlas-pr)
          targets this branch; do not edit by hand. Force-pushed on every
          pr-validation run for PR #${PR_NUMBER}.

          [skip ci]"
          git push --force-with-lease origin "$BRANCH"
          echo "Pushed bot/pr-${PR_NUMBER}-resolved at $(git rev-parse --short=7 HEAD)"

  # ============================================
  # Summary Job
  # ============================================
  pr-validation-complete:
    name: PR Validation Complete
    needs: [detect-changes, test-go-libraries, test-go-services, test-ui, build-docker, update-pr-overlay, go-analyzer-guards, npc-shop-contract-mirror-guard, npc-conversation-contract-mirror-guard, gen-lb-ports, gen-tenant-tables, mode-select, mode-report, service-registration-guard, shell-tooling-guard, template-opcode-order-guard, template-movement-types-guard, skill-job-id-guard, atlas-constants-drift-guard, lint-go, lint-ui]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        run: |
          echo "### PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check each job result
          DETECT_RESULT="${{ needs.detect-changes.result }}"
          LIBS_RESULT="${{ needs.test-go-libraries.result }}"
          SERVICES_RESULT="${{ needs.test-go-services.result }}"
          UI_RESULT="${{ needs.test-ui.result }}"
          DOCKER_RESULT="${{ needs.build-docker.result }}"
          OVERLAY_RESULT="${{ needs.update-pr-overlay.result }}"
          ANALYZER_GUARDS_RESULT="${{ needs.go-analyzer-guards.result }}"
          NPC_SHOP_CONTRACT_GUARD_RESULT="${{ needs.npc-shop-contract-mirror-guard.result }}"
          NPC_CONVERSATION_CONTRACT_GUARD_RESULT="${{ needs.npc-conversation-contract-mirror-guard.result }}"
          LBPORTS_RESULT="${{ needs.gen-lb-ports.result }}"
          TENANT_TABLES_GUARD_RESULT="${{ needs.gen-tenant-tables.result }}"
          MODE_SELECT_GUARD_RESULT="${{ needs.mode-select.result }}"
          MODE_REPORT_RESULT="${{ needs.mode-report.result }}"
          SVC_REG_GUARD_RESULT="${{ needs.service-registration-guard.result }}"
          SHELL_GUARD_RESULT="${{ needs.shell-tooling-guard.result }}"
          TMPL_ORDER_GUARD_RESULT="${{ needs.template-opcode-order-guard.result }}"
          TMPL_MOVE_GUARD_RESULT="${{ needs.template-movement-types-guard.result }}"
          SKILL_JOB_ID_GUARD_RESULT="${{ needs.skill-job-id-guard.result }}"
          CONSTANTS_DRIFT_GUARD_RESULT="${{ needs.atlas-constants-drift-guard.result }}"
          LINT_GO_RESULT="${{ needs.lint-go.result }}"
          LINT_UI_RESULT="${{ needs.lint-ui.result }}"

          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Detect Changes | $DETECT_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Libraries | $LIBS_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Services | $SERVICES_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| UI | $UI_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Builds | $DOCKER_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Resolve PR overlay | $OVERLAY_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Analyzer Guards (redis/outbox/goroutine/buff-duration) | $ANALYZER_GUARDS_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| NPC Shop Contract Mirror Guard | $NPC_SHOP_CONTRACT_GUARD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| NPC Conversation Contract Mirror Guard | $NPC_CONVERSATION_CONTRACT_GUARD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| LB Port Drift Guard | $LBPORTS_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Tenant Tables Drift Guard | $TENANT_TABLES_GUARD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode Select Decision Table Guard | $MODE_SELECT_GUARD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Ephemeral Environment Mode Report | $MODE_REPORT_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Service Registration Guard | $SVC_REG_GUARD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Shell Tooling Guard | $SHELL_GUARD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Template Opcode Order Guard | $TMPL_ORDER_GUARD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Template Movement Types Guard | $TMPL_MOVE_GUARD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Skill/Job Id Guard | $SKILL_JOB_ID_GUARD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| atlas-constants Generator Drift Guard | $CONSTANTS_DRIFT_GUARD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format Guard (Go) | $LINT_GO_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format Guard (UI) | $LINT_UI_RESULT |" >> $GITHUB_STEP_SUMMARY

          # detect-changes is load-bearing, not advisory: every test job
          # and (since the deploy-only gating) every source-only guard
          # hangs off it via `needs:`. GitHub SKIPS a dependent job when
          # its `needs:` target fails or is cancelled — it does not fail
          # it — and the skip-tolerant comparison below would then wave
          # the whole run through green with the guards never having run.
          # Require detect-changes to have actually succeeded.
          if [ "$DETECT_RESULT" != "success" ]; then
            echo ""
            echo "detect-changes did not succeed (result: $DETECT_RESULT)."
            echo "Every dependent test and guard job was skipped rather than run — refusing to report green."
            exit 1
          fi

          # Fail if any required job failed. Jobs are allowed to be
          # skipped — update-pr-overlay when the deploy-env label is
          # absent, the source-only guards on a deploy-only change set —
          # but never to fail outright. Comparing against "failure" (not
          # against "success") is what makes a skip pass. That tolerance
          # is only safe because detect-changes was verified above.
          if [ "$LIBS_RESULT" == "failure" ] || [ "$SERVICES_RESULT" == "failure" ] || [ "$UI_RESULT" == "failure" ] || [ "$DOCKER_RESULT" == "failure" ] || [ "$OVERLAY_RESULT" == "failure" ] || [ "$ANALYZER_GUARDS_RESULT" == "failure" ] || [ "$NPC_SHOP_CONTRACT_GUARD_RESULT" == "failure" ] || [ "$NPC_CONVERSATION_CONTRACT_GUARD_RESULT" == "failure" ] || [ "$LBPORTS_RESULT" == "failure" ] || [ "$TENANT_TABLES_GUARD_RESULT" == "failure" ] || [ "$MODE_SELECT_GUARD_RESULT" == "failure" ] || [ "$MODE_REPORT_RESULT" == "failure" ] || [ "$SVC_REG_GUARD_RESULT" == "failure" ] || [ "$SHELL_GUARD_RESULT" == "failure" ] || [ "$TMPL_ORDER_GUARD_RESULT" == "failure" ] || [ "$TMPL_MOVE_GUARD_RESULT" == "failure" ] || [ "$SKILL_JOB_ID_GUARD_RESULT" == "failure" ] || [ "$CONSTANTS_DRIFT_GUARD_RESULT" == "failure" ] || [ "$LINT_GO_RESULT" == "failure" ] || [ "$LINT_UI_RESULT" == "failure" ]; then
            echo ""
            echo "One or more jobs failed!"
            exit 1
          fi

          echo ""
          echo "All checks passed!"
