# Root golangci-lint v2 config — the single config source for every Go module
# in the repo (task-171). tools/lint.sh runs golangci-lint from each module's
# own directory with this file passed via -c; do not add per-module configs.
#
# Escape-hatch exclusions (design.md §5.4) must carry a comment naming the
# burn-down follow-up (docs/TODO.md "Lint burn-down").
version: "2"

linters:
  # The v2 `standard` default group: errcheck, govet, ineffassign,
  # staticcheck, unused. Membership is fixed by the version pin in
  # tools/toolchain.versions.
  default: standard
  exclusions:
    rules:
      # task-261 burn-down (docs/TODO.md "Lint burn-down"): the gofumpt blank-
      # line-before-multiline-func rule (go 1.27 / golangci-lint v2.13.1
      # migration) reformatted the line below, which put it under
      # --new-from-rev and surfaced this staticcheck QF1011 "could omit type"
      # suggestion. Applying it would drop the explicit
      # `func(character.Model) character.Model` annotation, which is this
      # test's compile-time assertion that PartyDecorator has exactly that
      # signature — a behavioral change (FR-5.3), not a mechanical one.
      - path: services/atlas-channel/atlas\.com/channel/character/processor_test\.go
        linters:
          - staticcheck
        text: "QF1011"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      # Group intra-repo imports separately (FR-2.2). gofumpt's module-path
      # stays UNSET — one shared config serves 80 modules; golangci-lint
      # derives it per module from each go.mod.
      local-prefixes:
        - github.com/Chronicle20/atlas
      # NOTE (task-171): libs/atlas-tenant declares `package tenant` but its
      # import path ends in `atlas-tenant`. goimports cannot reconcile that for
      # an UNaliased import and injects a duplicate `tenant "…/atlas-tenant"`
      # (→ "tenant redeclared", build break). Import it ALIASED — always write
      # `tenant "github.com/Chronicle20/atlas/libs/atlas-tenant"`. Do not
      # "simplify" that alias away. CI's lint-go --check fails loudly if you do.
