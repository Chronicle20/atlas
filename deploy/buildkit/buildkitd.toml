[worker.oci]
  max-parallelism = 8

# Evict aggressively-reclaimable cache first, then enforce a hard ceiling.
[[worker.oci.gcpolicy]]
  keepBytes = 40000000000
  keepDuration = 604800
  filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]

[[worker.oci.gcpolicy]]
  all = true
  keepBytes = 60000000000
