---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-consumables
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-consumables
  template:
    metadata:
      labels:
        app: atlas-consumables
    spec:
      containers:
      - name: atlas-consumables
        image: ghcr.io/chronicle20/atlas-consumables/atlas-consumables:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: atlas-env
        env:
        - name: SERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app']
        - name: LOG_LEVEL
          value: "debug"
