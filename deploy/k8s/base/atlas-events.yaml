---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-events
  labels:
    atlas.seed-catalog: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlas-events
  template:
    metadata:
      labels:
        app: atlas-events
    spec:
      volumes: []
      containers:
      - name: events
        image: ghcr.io/chronicle20/atlas-events/atlas-events:latest
        volumeMounts: []
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: atlas-env
        env:
        - name: LOG_LEVEL
          value: "debug"
        - name: DB_NAME
          value: "atlas-events"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
        - name: EVENTS_POLL_INTERVAL
          value: "5s"
        - name: EVENTS_WORK_LEASE
          value: "5m"
        - name: EVENTS_POLL_BATCH_SIZE
          value: "50"
        - name: EVENTS_WORK_MAX_ATTEMPTS
          value: "5"
        - name: EVENTS_WORK_BACKOFF
          value: "30s"
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-events
spec:
  selector:
    app: atlas-events
  ports:
  - protocol: TCP
    port: 8080
