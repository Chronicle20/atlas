---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-ingress-configmap
data:
  nginx.conf: |
    worker_processes  1;

    events {
      worker_connections  1024;
    }


    http {
      include mime.types;
      default_type  application/octet-stream;

      sendfile        on;

      keepalive_timeout  300;
      proxy_read_timeout 30;
      proxy_connect_timeout 10;
      proxy_send_timeout 30;
      send_timeout 30;

      underscores_in_headers on;

      # Resolves $atlas_environment: the caller's ENVIRONMENT header, or
      # this deployment's own environment when the caller sent none. See
      # env-default.conf.template.
      include /etc/nginx/conf.d/env-default.conf;

      # $atlas_environment records the RESOLVED environment (requires
      # underscores_in_headers on, above) so the access log carries the
      # operation's environment for cross-referencing with Loki/Prometheus
      # (FR-10).
      log_format main_env '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'env=$atlas_environment';

      access_log /dev/stdout main_env;

      server {
        listen       80;
        server_name  dev.atlas.home;

        client_max_body_size 500M;

        resolver 10.43.0.10 valid=30s;

        proxy_pass_request_headers on;
        proxy_set_header TENANT_ID $http_tenant_id;
        proxy_set_header REGION $http_region;
        proxy_set_header MAJOR_VERSION $http_major_version;
        proxy_set_header MINOR_VERSION $http_minor_version;
        proxy_set_header ENVIRONMENT $atlas_environment;

        # Local-debug overrides (tools/debug-start.sh). Mounted from the
        # optional ConfigMap `atlas-ingress-debug-overrides`, which is NOT
        # tracked by Argo CD (created/edited ad-hoc by the debug script).
        # Included BEFORE routes.conf so override location blocks win the
        # nginx first-regex-match rule. Glob include is lenient when the
        # directory is empty or the CM is absent.
        include /etc/nginx/conf.d/debug-overrides/*.conf;

        include /etc/nginx/conf.d/routes.conf;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-ingress
  template:
    metadata:
      labels:
        app: atlas-ingress
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: atlas-ingress
              topologyKey: kubernetes.io/hostname
      containers:
      - name: nginx
        image: nginx:latest
        env:
        - name: SERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app']
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Restrict envsubst to POD_NAMESPACE and the per-service NS_ variables
        # (task-232 Task 43) so it does not clobber nginx vars like
        # $request_uri, $u, $http_*. Requires nginx image >= 1.25.4. Verified
        # against docker-entrypoint.d/20-envsubst-on-templates.sh: the filter
        # is matched with `name ~ filter` in awk, i.e. a regex, not a literal
        # prefix — alternation works as written here.
        - name: NGINX_ENVSUBST_FILTER
          value: "POD_NAMESPACE|NS_|ATLAS_ENVIRONMENT_DEFAULT"
        # The per-overlay ENVIRONMENT default, sourced from the SAME
        # atlas-env key env.Self() reads so the two can never disagree.
        # Deliberately NOT `optional: true`: envsubst only substitutes
        # variables that are present in the process environment, so an
        # undefined one is copied through as the literal
        # "${ATLAS_ENVIRONMENT_DEFAULT}" and every untagged request would
        # then 400 in ParseEnvironment. A hard CreateContainerConfigError on
        # an overlay that drops the key is strictly better than that silent
        # outage; deploy/k8s/base/env-configmap.yaml guarantees the key
        # exists (empty) for every overlay that does not set it.
        - name: ATLAS_ENVIRONMENT_DEFAULT
          valueFrom:
            configMapKeyRef:
              name: atlas-env
              key: ATLAS_ENVIRONMENT
        # GENERATED by tools/gen-routes.sh — do not edit by hand. One NS_*
        # variable per routed service; every value defaults to
        # $(POD_NAMESPACE) so main and isolated-mode routing is unchanged
        # (NFR-7). A sparse overlay patches individual entries to point an
        # undeployed service at the baseline namespace.
        - name: NS_ATLAS_ACCOUNT
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_BAN
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_BUDDIES
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_BUFFS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_CASHSHOP
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_CHAIRS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_CHALKBOARDS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_CHARACTER
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_CHARACTER_FACTORY
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_CONFIGURATIONS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_DATA
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_DOORS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_DRAGONS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_DROPS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_DROP_INFORMATION
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_EFFECTIVE_STATS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_EVENTS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_FAMILIES
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_GUILDS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_INVENTORY
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_INVITES
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_KEYS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_KITES
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_MAP_ACTIONS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_MAPS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_MERCHANT
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_MESSAGES
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_MESSENGERS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_MINI_GAMES
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_MONSTERS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_MONSTER_BOOK
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_MOUNTS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_MTS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_NOTES
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_NPC_CONVERSATIONS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_NPC_SHOPS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_PARTIES
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_PARTY_QUESTS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_PETS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_PLAYER_NPCS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_PORTALS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_PORTAL_ACTIONS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_QUERY_AGGREGATOR
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_QUEST
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_RANKINGS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_RATES
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_REACTORS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_REACTOR_ACTIONS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_RENDERS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_REWARD_POOLS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_RPS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_SAGA_ORCHESTRATOR
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_SKILLS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_STORAGE
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_SUMMONS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_TENANTS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_TRADES
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_TRANSPORTS
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_UI
          value: $(POD_NAMESPACE)
        - name: NS_ATLAS_WORLD
          value: $(POD_NAMESPACE)
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: nginx-conf-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: nginx-routes-volume
          mountPath: /etc/nginx/templates/routes.conf.template
          subPath: routes.conf.template
        - name: nginx-routes-volume
          mountPath: /etc/nginx/templates/env-default.conf.template
          subPath: env-default.conf.template
        - name: nginx-debug-overrides-volume
          mountPath: /etc/nginx/conf.d/debug-overrides
          readOnly: true
      volumes:
      - name: nginx-conf-volume
        configMap:
          name: atlas-ingress-configmap
      - name: nginx-routes-volume
        configMap:
          name: atlas-ingress-routes
      # Optional ConfigMap holding per-service debug redirects (see
      # tools/debug-start.sh). `optional: true` lets the pod start even
      # when no debug session exists in the namespace.
      - name: nginx-debug-overrides-volume
        configMap:
          name: atlas-ingress-debug-overrides
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-ingress
spec:
  selector:
    app: atlas-ingress
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-ingress
spec:
  ingressClassName: traefik
  rules:
  - host: dev.atlas.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: atlas-ingress
            port:
              number: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlas-ingress-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: atlas-ingress
