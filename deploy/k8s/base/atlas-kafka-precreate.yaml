# Pre-create every Kafka topic this env will use, before any service consumer
# starts. Atlas services rely on Kafka topic auto-create on first publish, and
# many subscribe to the same topic concurrently at startup — the result is a
# "consumer fetch wedged: exceeded consecutive timeouts" stampede where
# kafka-go's Readers wedge and rebalance until topics materialise.
#
# Mechanism: a one-shot Job at sync-wave 0 that reads the code-derived topic
# token list from the mounted atlas-kafka-topics ConfigMap, resolves each
# token's per-environment name through the envFrom-injected atlas-env
# ConfigMap, and issues a single CreateTopics request covering every topic.
# Argo CD health-checks the Job — Deployments (pushed to sync-wave 10) won't
# start until this completes.
#
# Idempotent: re-applying the manifest re-creates the Job; existing topics are
# left alone (each topic that already exists surfaces a per-topic
# TopicAlreadyExists error, which is tolerated rather than failing the Job).
# Adding a new topic on main or in a PR overlay is picked up on the next sync.
#
# Also seeds (task-232 Task 45, design §6.3) committed end-of-log offsets for
# every override consumer group named in KAFKA_CONSUMER_GROUP — see
# services/atlas-kafka-precreate/ for the mechanism and NG6 (main is inert:
# the pass is skipped whenever KAFKA_CONSUMER_GROUP is unset). Whether a group
# is resettable depends on which sync this is. On a FIRST sync the group is
# still empty, and every Deployment sits at sync-wave 10 behind this Job, so
# the reset lands before any consumer joins. On a RE-SYNC of a live
# environment the Force=true,Replace=true above deletes and recreates this
# Job while the environment's Deployments have been joined to those groups
# for hours: the group is active, Kafka refuses the reset, and the pass SKIPS
# it (task-245). An active group is already initialized, which is the end
# state the pass exists to reach, so skipping is both correct and the safety
# property — a routine re-sync must never fast-forward a live environment
# past unprocessed messages. See services/atlas-kafka-precreate/ for the Go
# unit tests covering this behaviour.
apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-kafka-precreate
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Job pod templates are immutable: without Replace, any change to this
    # script makes ArgoCD's apply fail ("Job.batch ... is invalid: spec.template:
    # Invalid value") and, because this Job is wave 0, wedges the whole sync
    # (2026-07-08, pr-822). Replace deletes+recreates the Job instead.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-precreate
          image: ghcr.io/chronicle20/atlas-kafka-precreate/atlas-kafka-precreate:latest
          # envFrom only — no env: key. .github/workflows/pr-validation.yml's
          # JSON-6902 patch does `op: add` on /spec/template/spec/containers/0/env`
          # to inject KAFKA_CONSUMER_GROUP; op: add on an already-present key
          # REPLACES it, so if this container ever grows an env: key,
          # KAFKA_CONSUMER_GROUP silently becomes its only entry.
          envFrom:
            - configMapRef:
                name: atlas-env
          volumeMounts:
            - name: topic-manifest
              mountPath: /etc/atlas/topics
              readOnly: true
      volumes:
        - name: topic-manifest
          configMap:
            name: atlas-kafka-topics
