# Pre-create every Kafka topic this env will use, before any service consumer
# starts. Atlas services rely on Kafka topic auto-create on first publish, and
# many subscribe to the same topic concurrently at startup — the result is a
# "consumer fetch wedged: exceeded consecutive timeouts" stampede where
# kafka-go's Readers wedge and rebalance until topics materialise.
#
# Mechanism: a one-shot Job at sync-wave 0 that reads its own envFrom-injected
# atlas-env ConfigMap, picks out every COMMAND_TOPIC_* / EVENT_TOPIC_* value,
# and calls kafka-topics.sh --create --if-not-exists once per topic. Argo CD
# health-checks the Job — Deployments (pushed to sync-wave 10) won't start
# until this completes.
#
# Idempotent: re-applying the manifest re-creates the Job; existing topics are
# left alone (--if-not-exists). Adding a new topic on main or in a PR overlay
# is picked up on the next sync.
#
# Also seeds (task-232 Task 45, design §6.3) committed end-of-log offsets for
# every override consumer group named in KAFKA_CONSUMER_GROUP — see
# kafka-precreate.sh for the mechanism and NG6 (main is inert: the pass is
# skipped whenever KAFKA_CONSUMER_GROUP is unset). Whether a group is
# resettable depends on which sync this is. On a FIRST sync the group is still
# empty, and every Deployment sits at sync-wave 10 behind this Job, so the
# reset lands before any consumer joins. On a RE-SYNC of a live environment
# the Force=true,Replace=true above deletes and recreates this Job while the
# environment's Deployments have been joined to those groups for hours: the
# group is active, Kafka refuses the reset, and the pass SKIPS it (task-245).
# An active group is already initialized, which is the end state the pass
# exists to reach, so skipping is both correct and the safety property — a
# routine re-sync must never fast-forward a live environment past unprocessed
# messages. The script is mounted from the atlas-kafka-precreate-script
# ConfigMap (kustomization.yaml) instead of living inline here so it is
# independently sourceable and testable (atlas-kafka-precreate_test.sh).
apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-kafka-precreate
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Job pod templates are immutable: without Replace, any change to this
    # script makes ArgoCD's apply fail ("Job.batch ... is invalid: spec.template:
    # Invalid value") and, because this Job is wave 0, wedges the whole sync
    # (2026-07-08, pr-822). Replace deletes+recreates the Job instead.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: atlas-kafka-precreate
    spec:
      restartPolicy: OnFailure
      # Every namespace (main + each open PR) runs its own copy of this Job, and
      # Argo recreates it on every sync (Force=true,Replace=true above), so
      # several fire within seconds of each other. Without this they all land on
      # whichever node has room and stack their JVM fan-outs on one machine
      # (2026-08-21: three copies took 6.5 of eos's 8 cores). Spread them across
      # nodes instead. Preferred, not required: a single-node cluster, or more
      # concurrent PR envs than nodes, must still schedule.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: atlas-kafka-precreate
                # The copies we are spreading apart live in DIFFERENT
                # namespaces (atlas-main, atlas-pr-<n>, ...), and pod
                # anti-affinity defaults to same-namespace only — without an
                # empty namespaceSelector this term matches nothing and the
                # spread silently does not happen.
                namespaceSelector: {}
      containers:
        - name: kafka-precreate
          image: apache/kafka:3.7.2
          # Uncapped, this Job is BestEffort and its JVM fan-out will consume
          # every spare core on its node. The work is a fixed number of ~1s JVM
          # cold starts, so a cap costs wall-clock and nothing else, while an
          # overrun starves the game services sharing the node.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              # Headroom for the -P 4 fan-out: each kafka-topics.sh JVM can
              # take its default max heap, so the ceiling must clear 4 of them
              # at once. An OOMKill here is a wave-0 stall for the whole env.
              memory: 2Gi
          envFrom:
            - configMapRef:
                name: atlas-env
          volumeMounts:
            - name: kafka-precreate-script
              mountPath: /scripts
          command:
            - /bin/bash
            - /scripts/kafka-precreate.sh
      volumes:
        - name: kafka-precreate-script
          configMap:
            name: atlas-kafka-precreate-script
