---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-kites
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-kites
  template:
    metadata:
      labels:
        app: atlas-kites
    spec:
      containers:
      - name: kites
        image: ghcr.io/chronicle20/atlas-kites/atlas-kites:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: atlas-env
        env:
        - name: LOG_LEVEL
          value: "debug"
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-kites
spec:
  selector:
    app: atlas-kites
  ports:
  - protocol: TCP
    port: 8080
