# Daily MinIO tenant-reconcile CronJob (task-174).
#
# Runs services/atlas-pr-bootstrap's reconcile-minio.sh orchestrator, which
# enumerates the live-tenant UUID union across atlas-main + atlas-pr-*
# namespaces (fail-closed: any unreachable env aborts the run) and POSTs the
# keep-list to atlas-data's /api/data/minio/reconcile endpoint. This is a
# main-only resource: it must run exactly once cluster-wide, not per-PR-env.
# See deploy/k8s/overlays/pr/kustomization.yaml for the delete-patches that
# exclude every resource below from the `pr` overlay (which pulls in
# `../../base` wholesale). The `pr-cleanup` overlay does not include base at
# all, so no exclusion is needed there.
#
# RECONCILE_DRY_RUN is "false": the orchestrator actually removes orphaned
# tenants/<uuid>/ prefixes. It shipped as "true" and ran observe-only from
# 2026-07-18 to 2026-08-07; over those 20 days it never deleted anything, so
# orphans that aged past RECONCILE_MIN_AGE_HOURS leaked permanently (7 stale
# atlas-renders prefixes were live evidence). The dry-run cycles it was
# gating on have been validated — a keep-list POST correctly enumerated every
# prefix with counts, bytes, and ages. Set back to "true" to re-observe.
#
# Deleting is guarded four ways, all in reconcile-minio.sh / atlas-data's
# minioreconcile package: an empty keep-list is refused outright, the
# canonical sentinel UUID is never a delete candidate, a prefix newer than
# RECONCILE_MIN_AGE_HOURS is kept, and an unreachable namespace aborts the
# whole run rather than treating its tenants as orphaned.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-minio-reconcile
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atlas-minio-reconcile
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlas-minio-reconcile
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlas-minio-reconcile
subjects:
  - kind: ServiceAccount
    name: atlas-minio-reconcile
    namespace: atlas-main   # overlay sets the real namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-minio-reconcile-config
data:
  RECONCILE_DRY_RUN: "false"
  RECONCILE_MIN_AGE_HOURS: "48"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-minio-reconcile
spec:
  schedule: "0 3 * * *"          # daily 03:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: atlas-minio-reconcile
          restartPolicy: Never
          # ghcr-pull is a dockerconfigjson Secret carrying a GHCR PAT (see
          # deploy/k8s/overlays/pr/sync-bootstrap.yaml) because the
          # atlas-pr-bootstrap package on GHCR is private. It is not yet
          # replicated into atlas-main (cluster-infra Reflector rule only
          # covers atlas-pr-.* namespaces) — see task-5-report.md concerns.
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: reconcile
              image: ghcr.io/chronicle20/atlas-pr-bootstrap/atlas-pr-bootstrap:latest
              command: ["/atlas/reconcile-minio.sh"]
              envFrom:
                - configMapRef:
                    name: atlas-minio-reconcile-config
              env:
                - name: ATLAS_DATA_BASE
                  value: http://atlas-data.atlas-main.svc.cluster.local:8080
