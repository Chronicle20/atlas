---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-player-npcs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-player-npcs
  template:
    metadata:
      labels:
        app: atlas-player-npcs
    spec:
      containers:
      - name: player-npcs
        image: ghcr.io/chronicle20/atlas-player-npcs/atlas-player-npcs:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: atlas-env
        env:
        - name: SERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app']
        - name: LOG_LEVEL
          value: "debug"
        - name: DB_NAME
          value: "atlas-player-npcs"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-player-npcs
spec:
  selector:
    app: atlas-player-npcs
  ports:
  - protocol: TCP
    port: 8080
