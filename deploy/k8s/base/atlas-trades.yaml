---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-trades
spec:
  # The live trade-room registry is process-local in-memory state (design §9),
  # so a second replica would split rooms across pods and break in-flight
  # trades. This is a correctness constraint, not a capacity choice — do not
  # scale this Deployment horizontally and do not attach an HPA.
  replicas: 1
  selector:
    matchLabels:
      app: atlas-trades
  template:
    metadata:
      labels:
        app: atlas-trades
    spec:
      containers:
      - name: trades
        image: ghcr.io/chronicle20/atlas-trades/atlas-trades:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: atlas-env
        env:
        - name: SERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app']
        - name: LOG_LEVEL
          value: "debug"
        - name: DB_NAME
          value: "atlas-trades"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
        readinessProbe:
          httpGet:
            path: /api/readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-trades
spec:
  selector:
    app: atlas-trades
  ports:
  - protocol: TCP
    port: 8080
