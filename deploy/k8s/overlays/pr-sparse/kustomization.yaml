# Sparse PR overlay shell (task-232 Task 44, Phase D).
#
# Unlike overlays/pr (the isolated overlay this file is derived from), this
# overlay deploys only the override set's Deployments (design §17) plus the
# always-local atlas-ingress. Every other service is routed through NS_*
# (Task 43, deploy/k8s/base/ns-vars.generated.yaml) to the baseline
# namespace, and the environment-record Job below tells every consumer
# which services those are.
#
# PLACEHOLDER_PR_NUMBER / PLACEHOLDER_ATLAS_ENV / PLACEHOLDER_FULL_SHA are
# scalar sentinel strings resolved at CI time by
# .github/workflows/pr-validation.yml's update-pr-overlay job, exactly as
# in overlays/pr/kustomization.yaml:1-20 (Task 50 extends that job to this
# overlay) — sed-substituted across this directory, then force-pushed to
# bot/pr-<N>-resolved. The Argo CD ApplicationSet(atlas-pr-sparse) targets
# that derived branch, NOT the PR head directly, so kustomize never sees
# the placeholders.
#
# Two more scalar placeholders name the baseline environment without
# hard-coding it (env.Id "main" MUST NOT appear as a literal here — design
# §9, FR-1.5):
#   PLACEHOLDER_BASELINE_ENVIRONMENT — the baseline's env.Id (e.g. "main"),
#     used only in environment-record.yaml's `baseline` attribute.
#   PLACEHOLDER_BASELINE_NAMESPACE — the baseline's k8s namespace (e.g.
#     "atlas-main"), used in ns-overrides.yaml (the NS_* values every
#     undeployed service routes through) and in environment-record.yaml
#     (the environment-record Job POSTs directly to the baseline's own
#     atlas-ingress, since atlas-configurations is never part of the
#     override set). Task 50 resolves both from the ACTIVE baseline
#     environment record — the same source of truth every other consumer
#     of env.Record.Baseline reads from, never a literal.
#
# All FIVE placeholders above are single-line scalars: CI's substitution
# is a blind whole-directory `sed` substring replace
# (.github/workflows/pr-validation.yml:725-731, `find ... -exec sed -i -e
# "s|X|Y|g" {} +` across every .yaml/.yml file), and a scalar replacement
# value is harmless even where it lands inside a comment — it stays a
# valid single line.
#
# TWO more sentinels below carry MULTI-LINE block content instead: the
# delete-set anchor in this file's `patches:` list, and the
# NS-override-set anchor in ns-overrides.yaml. Those are a categorically
# different shape — a multi-line replacement value spliced into a second,
# unintended occurrence of the same sentinel text corrupts the file (a
# comment line does not survive gaining embedded raw structure mid-line).
# So each block sentinel's exact text appears exactly ONCE across every
# .yaml/.yml file in this directory — at its own anchor, a lone comment
# line — and is never spelled out again, including in this header; see
# each anchor's own comment, in place, for its fill contract and the
# required newline-escaping convention.
#
# As a side effect of the bot-branch model: the `images:` block below
# starts with `newTag: latest` for every service, matching overlays/pr.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace is rewritten by the ApplicationSet at sync time:
# atlas-pr-PLACEHOLDER_PR_NUMBER -> atlas-pr-<actual PR number>
namespace: atlas-pr-PLACEHOLDER_PR_NUMBER

resources:
  - ../../base
  - atlas-env-tokens.yaml
  - ingress-route.yaml
  - sync-bootstrap.yaml
  - predelete-purge.yaml
  - postsync-pihole-add.yaml
  - environment-record.yaml
  # wave0-create-dbs.yaml (overlays/pr) is intentionally NOT included: a
  # sparse env shares the baseline's databases (D1) — there is nothing to
  # pre-create.
  # Note: the PostDelete cleanup Job, same as overlays/pr, does NOT live
  # here — it is shared cross-overlay tooling that lives in
  # deploy/k8s/overlays/pr-cleanup/ (see that overlay's header and
  # task-070/design.md §3.1 (Design A)).
  #
  # atlas-env-tokens.yaml / ingress-route.yaml / sync-bootstrap.yaml /
  # predelete-purge.yaml / postsync-pihole-add.yaml are byte-identical
  # copies of the same-named files in ../pr/ — kustomize's default load
  # restrictor forbids a patch/resource path from escaping this
  # directory's tree, so a relative ../pr/ reference is not viable. Keep
  # them in sync with ../pr/ by hand until Task 50 (or a follow-up) moves
  # the shared ones to a common base both overlays include.

patches:
  # The NS_* override patch onto atlas-ingress (Task 43's per-service
  # routing variables) — the mechanism that makes "only 4 Deployments"
  # correct routing rather than a broken one.
  - path: ns-overrides.yaml
  - path: patches/ingress-host.yaml
  - path: patches/consumer-group-env.yaml
  - path: patches/lb-allocate.yaml
  # D1 gives a sparse env the BASELINE's databases, and the baseline's
  # databases are suffixed with its environment id — there is no
  # unsuffixed `atlas-characters` in the cluster, only
  # `atlas-characters-main`. This overlay originally omitted a DB_NAME
  # patch entirely on the reading that "shared databases" meant "base's
  # unsuffixed name"; that would point any DB-backed override service at
  # a database that does not exist. So the patch IS included, suffixing
  # with -PLACEHOLDER_BASELINE_ENVIRONMENT instead of overlays/pr's
  # -PLACEHOLDER_ATLAS_ENV. Regenerate with:
  #   ../pr/scripts/gen-db-name-suffix.sh pr-sparse PLACEHOLDER_BASELINE_ENVIRONMENT
  # wave0-create-dbs.yaml stays excluded (see the resources list): the
  # baseline's databases already exist, so there is still nothing to
  # pre-create. The three patches above are byte-identical copies of
  # ../pr/patches/ — same load-restrictor constraint as the resources
  # list.
  - path: patches/db-name-suffix.yaml
  #
  # Ephemeral PR envs do not need HA. Pin every Deployment to a single
  # replica to halve the pod footprint vs main (some base manifests ship
  # with replicas: 2 or 4). Same cluster-relief patch as overlays/pr
  # (task-063 deploy testing, 2026-05-15). Targets kind=Deployment so Jobs
  # / IngressRoutes etc. are untouched.
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Spread this PR env's pods evenly across schedulable nodes. Same
  # rationale as overlays/pr, with the env label sed-substituted at CI
  # time so each PR env spreads only its own pods, not across other PR
  # envs.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                atlas.env: "PLACEHOLDER_ATLAS_ENV"
  # Force a fresh pull for every app container in the PR env. Same
  # rationale as overlays/pr (incident 2026-07-15, atlas-maps serving a
  # stale atlas-rest under the frozen-:latest-digest failure mode). Base
  # atlas Deployments are single-container, so containers/0 is always the
  # app container.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # Override GITSYNC_REF so the git-sync sidecar tracks the PR's full
  # commit SHA (not main). CI sed-substitutes PLACEHOLDER_FULL_SHA at
  # apply time.
  - path: patches/seed-catalog-ref.yaml
    target:
      kind: ConfigMap
      name: seed-catalog-config
  # Tell bootstrap.sh it is running against a SHARED atlas-configurations
  # database (task-232 task-47): ATLAS_MODE=sparse switches
  # upsert_service_config's dangerous main-row merge off in favour of
  # create_service_config, which creates a fresh Id-keyed row per
  # environment and never reads/writes/merges into main's pinned row
  # (G7/NG6). sync-bootstrap.yaml (the Job manifest) is one of the 9 files
  # tools/pr-sparse-mirror-guard.sh binds byte-identical to overlays/pr, so
  # ATLAS_MODE cannot be added there — this overlay-only strategic patch is
  # the only place it can land without failing the guard or changing the
  # isolated overlay. ATLAS_ENVIRONMENT (needed to stamp the fresh row so
  # teardown/write-authorisation can scope it) rides the same patch, sourced
  # from the atlas-env ConfigMap this overlay already generates above with
  # literal ATLAS_ENVIRONMENT=pr-PLACEHOLDER_PR_NUMBER.
  - target:
      kind: Job
      name: atlas-pr-bootstrap
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ATLAS_MODE
          value: sparse
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ATLAS_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: atlas-env
              key: ATLAS_ENVIRONMENT
  # atlas-minio-reconcile (task-174) is a main-only CronJob: it enumerates
  # tenants across every atlas-main + atlas-pr-* namespace and reconciles
  # MinIO storage cluster-wide, so it must run exactly once, not once per
  # PR env — including per sparse PR env. Its ClusterRole/ClusterRoleBinding
  # are cluster-scoped, so leaving them in would collide by name across
  # concurrently-running PR overlays. Delete the whole resource set here,
  # same as overlays/pr; it applies only via deploy/k8s/overlays/main.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: atlas-minio-reconcile
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: atlas-minio-reconcile
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: atlas-minio-reconcile
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: atlas-minio-reconcile-config
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: atlas-minio-reconcile
  # The delete-set anchor (see this file's header for why it's a lone
  # comment line, not a bare scalar). CI (Task 50) computes "every base
  # Deployment not in the override set" (deploy/k8s/base/atlas-*.yaml
  # minus the four kept names) and blind-`sed`-replaces the anchor line
  # below with one `$patch: delete` entry per name, e.g.:
  #   - patch: |-
  #       $patch: delete
  #       apiVersion: apps/v1
  #       kind: Deployment
  #       metadata:
  #         name: atlas-account
  # The replacement value must escape every embedded newline as a
  # backslash immediately followed by a real newline (GNU `sed s///`'s
  # standard multi-line-replacement idiom) and must itself START with one
  # such escaped newline, so the leading `#` on the anchor line comments
  # out only the (now-empty) anchor rather than swallowing the first
  # patch entry into the comment.
  #
  # DO NOT reuse `|` as the `sed` delimiter for this substitution (unlike
  # the three scalar placeholders' `s|X|Y|g`, which is safe because none
  # of PR_NUMBER/ATLAS_ENV/FULL_SHA ever contains `|`). The payload here
  # is generated `$patch: delete` YAML, which itself uses `|-` (the
  # block-scalar marker) — `|` inside the replacement collides with `|`
  # as delimiter and `sed` fails outright (`unknown option to 's'`,
  # reproduced directly). Use a delimiter guaranteed absent from the
  # payload instead, e.g. a control character (`sed "s${D}X${D}Y${D}g"`
  # with `D=$'\x01'` in bash), or substitute this one sentinel with
  # `perl -0777 -pe` rather than `sed`. Verified directly with the
  # control-character delimiter — see task-44-report.md's fix-round-1
  # entry for the exact invocation and its output.
  #
  # Empty, as checked in here (a lone comment — ignored by the YAML
  # parser, so this file still parses raw), this overlay builds every
  # base Deployment, same as overlays/pr — the smoke-test shape exercised
  # by Task 44 Step 4.
  # The SERVICE_ID anchor (same lone-comment-line convention as the
  # delete-set anchor above — see this file's header for why). CI fills
  # this line with one inline strategic-merge patch per override-set
  # Deployment that carries a SERVICE_ID in base, setting that
  # Deployment's SERVICE_ID to uuid5(ATLAS_SERVICE_NS, "<type>/<env>") —
  # tools/derive-service-id.sh, the single derivation site (task-243 D1/D2).
  # THIS is what makes the binding survive Argo's selfHeal (FR-1.2): the value
  # is in the manifest Argo renders, so there is nothing to revert. The same
  # CI loop also emits a JSON-6902 patch adding SERVICE_ID_<TYPE> to the
  # atlas-pr-bootstrap Job, so bootstrap POSTs the id it rendered rather than
  # deriving one itself. Filled by .github/workflows/pr-validation.yml's
  # update-pr-overlay job; sparse mode only.
  #PLACEHOLDER_SERVICE_ID_BLOCK
  # The PRECREATE_GROUPS anchor (same convention). CI fills this line
  # with a JSON-6902 patch adding a newline-delimited KAFKA_CONSUMER_GROUP
  # to the wave-0 atlas-kafka-precreate Job, so groups.Seed /
  # groups.Verify stop taking their unset-guard early return
  # (services/atlas-kafka-precreate/internal/groups/groups.go:46,191, task-243 design §1.1 — the mechanism exists and
  # was one wire short). Patched onto the JOB, deliberately NOT added to the
  # atlas-env ConfigMap: every container in the namespace reads atlas-env via
  # envFrom, and a multi-line group list there would become the consumer
  # group of any container without a container-level override.
  #PLACEHOLDER_PRECREATE_GROUPS_BLOCK
  #PLACEHOLDER_DELETE_BLOCK

# Per-env atlas-env ConfigMap. `merge` (not `replace`, unlike overlays/pr)
# layers only what a sparse env changes on top of base/env-configmap.yaml:
# base already ships DB_HOST/DB_PORT/REDIS_URL/TRACE_*/REST_PORT, and
# `merge` keeps all of that untouched.
#
# What it does NOT keep untouched is the topic table. Base ships every
# COMMAND_TOPIC_*/EVENT_TOPIC_* UNSUFFIXED, and until 2026-08-20 this
# overlay let those base values stand — "topic suffixing disappears in
# sparse mode (D1, FR-4.8)". That was wrong, and it wedged atlas-login in
# atlas-pr-1411: unsuffixed is not the same as the baseline's. The
# baseline overlay suffixes all 170 topics with its OWN environment id
# (`-main` today), so the unsuffixed names address topics that exist but
# that nobody ever publishes to. atlas-login's configuration projection
# read end offsets of 0 on an empty topic, declared itself caught up
# before its consumer was even assigned a partition, published a nil
# service snapshot, and fatally timed out 60s later looking for the
# `timeout` task. See docs/tasks/task-232-sparse-ephemeral-environments/
# bug-sparse-baseline-scoping.md.
#
# So a sparse env names topics the way the BASELINE names them —
# `-PLACEHOLDER_BASELINE_ENVIRONMENT`, resolved by CI from the ACTIVE
# baseline environment record (pr-validation.yml's "Resolve baseline
# environment" step), never a hard-coded `-main`. Sharing the baseline's
# topics is the whole point of sparse mode; the ownership gate
# (libs/atlas-kafka, FR-4.4/4.6) is what keeps the two deployments from
# double-processing, not the topic name.
#
# The literals below are generated — regenerate with:
#   tools/gen-topics.sh
#
# ATLAS_ENV stays absent from this ConfigMap. It lives only on individual
# container envs (patches/consumer-group-env.yaml), where it scopes two
# things that MUST stay per-deployment: KAFKA_CONSUMER_GROUP uniqueness,
# and libs/atlas-lock's leader-election lease (`atlas:lock:<ATLAS_ENV>:`)
# — a sparse override that shared main's lease would lose every
# leader-gated sweep to main's pod, which is the task-200 defect.
#
# ATLAS_REDIS_ENV is the counterpart for the Redis KEYSPACE, which must
# match the baseline's rather than be per-deployment: the override pods
# and the baseline pods serve environments out of one shared Redis.
# design §9 assumed leaving ATLAS_ENV unset made the prefix "inert" and
# so needed no code change. Both halves were wrong — the container patch
# sets ATLAS_ENV anyway, and the baseline's prefix is `main:atlas:`, not
# the empty-env `atlas:`. libs/atlas-redis now reads ATLAS_REDIS_ENV in
# preference to ATLAS_ENV, falling back when unset so isolated mode and
# the baseline are unchanged.
configMapGenerator:
  - name: atlas-env
    behavior: merge
    literals:
      - BASE_SERVICE_URL=http://atlas-ingress.atlas-pr-PLACEHOLDER_PR_NUMBER.svc.cluster.local:80/api/
      - BOOTSTRAP_SERVERS=kafka-broker.kafka.svc.cluster.local:9093
      # env.Self() reads this (libs/atlas-env SelfVar) — it is what lets a
      # pod in this namespace answer "which environment am I" once the
      # environment record goes ACTIVE (Task 45).
      - ATLAS_ENVIRONMENT=pr-PLACEHOLDER_PR_NUMBER
      # Redis keyspace: the baseline's, not this deployment's. See above.
      - ATLAS_REDIS_ENV=PLACEHOLDER_BASELINE_ENVIRONMENT
      # BEGIN generated:topics (libs/atlas-kafka/gen -- run tools/gen-topics.sh)
      - COMMAND_TOPIC_ACCOUNT=COMMAND_TOPIC_ACCOUNT-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_ACCOUNT_SESSION=COMMAND_TOPIC_ACCOUNT_SESSION-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_BAN=COMMAND_TOPIC_BAN-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_BUDDY_LIST=COMMAND_TOPIC_BUDDY_LIST-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_CASH_COMPARTMENT=COMMAND_TOPIC_CASH_COMPARTMENT-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_CASH_ITEM=COMMAND_TOPIC_CASH_ITEM-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_CASH_SHOP=COMMAND_TOPIC_CASH_SHOP-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_CHAIR=COMMAND_TOPIC_CHAIR-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_CHALKBOARD=COMMAND_TOPIC_CHALKBOARD-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_CHANNEL_STATUS=COMMAND_TOPIC_CHANNEL_STATUS-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_CHARACTER=COMMAND_TOPIC_CHARACTER-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_CHARACTER_BUFF=COMMAND_TOPIC_CHARACTER_BUFF-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_CHARACTER_CHANNEL_CHANGE_REQUEST=COMMAND_TOPIC_CHARACTER_CHANNEL_CHANGE_REQUEST-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_CHARACTER_CHAT=COMMAND_TOPIC_CHARACTER_CHAT-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_CHARACTER_MOVEMENT=COMMAND_TOPIC_CHARACTER_MOVEMENT-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_COMPARTMENT=COMMAND_TOPIC_COMPARTMENT-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_CONSUMABLE=COMMAND_TOPIC_CONSUMABLE-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_DATA=COMMAND_TOPIC_DATA-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_DOOR=COMMAND_TOPIC_DOOR-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_DRAGON=COMMAND_TOPIC_DRAGON-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_DROP=COMMAND_TOPIC_DROP-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_EXPRESSION=COMMAND_TOPIC_EXPRESSION-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_FAME=COMMAND_TOPIC_FAME-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_FAMILY=COMMAND_TOPIC_FAMILY-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_GUILD=COMMAND_TOPIC_GUILD-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_GUILD_THREAD=COMMAND_TOPIC_GUILD_THREAD-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_INSTANCE_TRANSPORT=COMMAND_TOPIC_INSTANCE_TRANSPORT-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_INVITE=COMMAND_TOPIC_INVITE-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_ITEM_CONSUMED_ON_PICKUP=COMMAND_TOPIC_ITEM_CONSUMED_ON_PICKUP-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_KITE=COMMAND_TOPIC_KITE-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_MAP=COMMAND_TOPIC_MAP-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_MAP_ACTIONS=COMMAND_TOPIC_MAP_ACTIONS-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_MARRIAGE=COMMAND_TOPIC_MARRIAGE-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_MERCHANT=COMMAND_TOPIC_MERCHANT-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_MESSENGER=COMMAND_TOPIC_MESSENGER-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_MINI_GAME=COMMAND_TOPIC_MINI_GAME-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_MIST=COMMAND_TOPIC_MIST-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_MONSTER=COMMAND_TOPIC_MONSTER-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_MONSTER_BOOK=COMMAND_TOPIC_MONSTER_BOOK-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_MONSTER_MOVEMENT=COMMAND_TOPIC_MONSTER_MOVEMENT-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_MTS=COMMAND_TOPIC_MTS-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_MTS_CUSTODY=COMMAND_TOPIC_MTS_CUSTODY-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_NOTE=COMMAND_TOPIC_NOTE-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_NPC=COMMAND_TOPIC_NPC-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_NPC_CONVERSATION=COMMAND_TOPIC_NPC_CONVERSATION-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_NPC_SHOP=COMMAND_TOPIC_NPC_SHOP-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_PARCEL=COMMAND_TOPIC_PARCEL-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_PARCEL_CUSTODY=COMMAND_TOPIC_PARCEL_CUSTODY-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_PARTY=COMMAND_TOPIC_PARTY-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_PARTY_QUEST=COMMAND_TOPIC_PARTY_QUEST-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_PET=COMMAND_TOPIC_PET-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_PET_MOVEMENT=COMMAND_TOPIC_PET_MOVEMENT-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_PLAYER_NPC=COMMAND_TOPIC_PLAYER_NPC-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_PORTAL=COMMAND_TOPIC_PORTAL-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_PORTAL_ACTIONS=COMMAND_TOPIC_PORTAL_ACTIONS-PLACEHOLDER_BASELINE_ENVIRONMENT
      - COMMAND_TOPIC_QUEST=COMMAND_TOPIC_QUEST-PLACEHOLDER_BASELINE_ENVIRONMENT
