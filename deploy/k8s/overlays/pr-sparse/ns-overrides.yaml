# The sparse overlay's whole routing trick: point every NS_* variable
# (Task 43, deploy/k8s/base/ns-vars.generated.yaml) EXCEPT the override
# set's own at the baseline namespace, so atlas-ingress's nginx envsubst
# (deploy/k8s/base/atlas-ingress.yaml) resolves each undeployed service's
# upstream there instead of $(POD_NAMESPACE) (its own, now-empty
# namespace).
#
# NS_ATLAS_CHARACTER is intentionally absent: atlas-character is in the
# override set (deployed locally, in THIS namespace), so its default
# $(POD_NAMESPACE) value is already correct and must not be touched.
# atlas-login and atlas-channel have no NS_* entry at all — they are
# reached via their own LB Services (patches/lb-allocate.yaml), never
# through the nginx ingress's NS_* routing table.
#
# The anchor below (a lone comment line, not a bare scalar — see
# kustomization.yaml's header for why) is filled by CI (Task 50) with one
# `- name: ...` / `value: ...` pair per non-override-set NS_* variable,
# all pointing at PLACEHOLDER_BASELINE_NAMESPACE (the baseline's k8s
# namespace — resolved from the ACTIVE baseline environment record, never
# a literal "atlas-main" — see kustomization.yaml's header). Its exact
# sentinel text appears nowhere else in this directory's .yaml/.yml
# files — only at the anchor itself, below — and the replacement value
# follows the same escaped-newline, leading-escaped-newline, non-`|`-
# delimiter contract documented at kustomization.yaml's delete-set
# anchor: it must start with one escaped newline so the anchor's leading
# `#` comments out only the (now-empty) anchor line, not the first
# override entry. This payload does not itself contain `|`, but keep the
# same non-`|` delimiter convention as the delete-set anchor for
# consistency — see that anchor's comment for the reproduced failure
# mode and the verified fix.
#
# Checked in empty, as here, this is a syntactically valid, no-op
# strategic-merge patch: `env:` layers zero entries onto the base
# container's env list, matching Task 44 Step 4's smoke-test shape (build
# succeeds, base's NS_* defaults untouched).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-ingress
spec:
  template:
    spec:
      containers:
        - name: nginx
          env:
            #PLACEHOLDER_NS_OVERRIDES
