# Per-PR overlay shell.
#
# 8527 / 1605 / 35d40818f8920022b169c52c1db5de27f95e7dba are
# sentinel strings resolved at CI time by .github/workflows/pr-validation.yml's
# update-pr-overlay job, which sed-substitutes them across this directory
# and force-pushes the result to bot/pr-<N>-resolved. The Argo CD
# ApplicationSet(atlas-pr) targets that derived branch, NOT the PR head
# directly — so kustomize never sees the placeholders.
#
# This approach sidesteps kustomize's substring-substitution limitations
# (bracketed KAFKA_CONSUMER_GROUP, variable-dash DB_NAME) which couldn't
# be cleanly resolved via either kustomization.yaml's `replacements:` or
# Argo CD's `kustomize.patches`. The CI bot can use plain sed.
#
# As a side effect of the bot-branch model: the `images:` block below
# starts with `newTag: latest` for every service. Bot job bumps only
# the services it actually rebuilt to `pr-<N>-<sha>`; the rest stay on
# `:latest`, which resolves to whatever main-side option-(b) image
# promotion last digested.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace is rewritten by the ApplicationSet at sync time:
# atlas-pr-1605 -> atlas-pr-<actual PR number>
namespace: atlas-pr-1605
resources:
  - ../../base
  - atlas-env-tokens.yaml
  - ingress-route.yaml
  - wave0-create-dbs.yaml
  - sync-bootstrap.yaml
  - predelete-purge.yaml
  - postsync-pihole-add.yaml
  # Note: the PostDelete cleanup Job intentionally does NOT live here.
  # It moved to deploy/k8s/overlays/pr-cleanup/ (its own kustomization)
  # so kustomize's overlay-level `namespace:` directive doesn't override
  # the Job's `namespace: argocd`. See pr-cleanup/kustomization.yaml
  # header and task-070/design.md §3.1 (Design A).
patches:
  - path: patches/ingress-host.yaml
  - path: patches/db-name-suffix.yaml
  - path: patches/consumer-group-env.yaml
  - path: patches/lb-allocate.yaml
  # Ephemeral PR envs do not need HA. Pin every Deployment to a single
  # replica to halve the pod footprint vs main (some base manifests ship
  # with replicas: 2 or 4). This is the cluster-relief patch from the
  # task-063 deploy testing on 2026-05-15 — gaia + helios were sitting at
  # the default kubelet --max-pods=110, control plane was flapping
  # NodeNotReady. Targets kind=Deployment so Jobs / IngressRoutes etc.
  # are untouched.
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Spread this PR env's pods evenly across schedulable nodes. Same
  # rationale as the main overlay (avoid the scheduler piling all
  # single-replica Deployments onto one node), with the env label sed-
  # substituted at CI time so each PR env spreads only its own pods, not
  # across other PR envs.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                atlas.env: "8527"
  # Force a fresh pull for every app container in the PR env.
  #
  # Why this is needed: only the services a PR actually rebuilt are
  # tagged `pr-<N>-<sha>`; unchanged services keep `newTag: latest`
  # (see the images: block below and pr-validation.yml update-pr-overlay).
  # `imagePullPolicy` is never set in-repo, so it is k8s-defaulted — and
  # the default is set ONCE at first admission and then persists. On a
  # PR's first build every service is tagged `pr-<N>-<sha>` (a specific
  # tag → default IfNotPresent), and later pushes flip the unchanged ones
  # back to `:latest` without the persisted IfNotPresent ever re-defaulting
  # to Always. The net effect is `image: :latest` + `IfNotPresent`, so the
  # node freezes on whatever `:latest` digest it first cached and never
  # re-pulls when the moving `:latest` tag advances on main. When a
  # fleet-wide shared-lib fix lands on main mid-env-life (e.g. #993's
  # paginated-GET tenant-header fix), those frozen services silently run
  # the pre-fix image — surfaced 2026-07-15 as atlas-maps serving a stale
  # atlas-rest and dropping the tenant header on the paged spawn-point
  # fetch, so no monsters spawned.
  #
  # Pinning Always guarantees each pod resolves the current `:latest`
  # manifest on creation. `:latest` is never pruned by the ghcr retention
  # sweep (#985), so this is also robust against that. Ephemeral PR envs
  # are short-lived and low-traffic, so the extra pull-on-create cost is
  # negligible. Base atlas Deployments are single-container, so
  # containers/0 is always the app container.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # Override GITSYNC_REF so the git-sync sidecar tracks the PR's full
  # commit SHA (not main). CI sed-substitutes 35d40818f8920022b169c52c1db5de27f95e7dba at
  # apply time. Full SHA — not short — is required because
  # `git fetch <remote> <ref>` against GitHub does not resolve
  # abbreviated SHAs.
  - path: patches/seed-catalog-ref.yaml
    target:
      kind: ConfigMap
      name: seed-catalog-config
  # atlas-minio-reconcile (task-174) is a main-only CronJob: it enumerates
  # tenants across every atlas-main + atlas-pr-* namespace and reconciles
  # MinIO storage cluster-wide, so it must run exactly once, not once per PR
  # env. Its ClusterRole/ClusterRoleBinding are cluster-scoped (not
  # namespaced), so leaving them in would also collide by name across
  # concurrently-running PR overlays. Delete the whole resource set here;
  # it applies only via deploy/k8s/overlays/main.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: atlas-minio-reconcile
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: atlas-minio-reconcile
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: atlas-minio-reconcile
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: atlas-minio-reconcile-config
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: atlas-minio-reconcile
# Per-env atlas-env ConfigMap with topic suffixing.
configMapGenerator:
  - name: atlas-env
    behavior: replace
    literals:
      # Infrastructure literals.
      # Isolated mode registers no control-plane environment record, so it
      # must keep env.Self()=="" (FR-1.5). Present-but-empty rather than
      # absent, because this generator is `behavior: replace` and would
      # otherwise drop the base key that atlas-ingress's envsubst needs to
      # be defined — see deploy/k8s/base/env-configmap.yaml.
