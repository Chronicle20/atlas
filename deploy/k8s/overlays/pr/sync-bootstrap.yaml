---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-pr-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlas-pr-bootstrap
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # patch/update (re-examined task-243): sparse mode no longer needs to
    # repoint SERVICE_ID via `kubectl set env` (the id now arrives
    # pre-rendered in the manifest), but the restart loop still issues
    # `kubectl rollout restart deployment/atlas-{drops,world,
    # character-factory}` in BOTH modes — that call needs patch. Do not
    # drop these verbs without also removing that restart loop.
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlas-pr-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atlas-pr-bootstrap
subjects:
  - kind: ServiceAccount
    name: atlas-pr-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-pr-bootstrap
  annotations:
    # `Sync` hook (was PostSync, see incident 2026-05-15). PostSync waits for
    # the entire Sync phase to reach Healthy before firing. But several Atlas
    # services (atlas-channel, atlas-login, atlas-world, atlas-drops) panic
    # on startup if they cannot fetch their tenant config from
    # atlas-configurations — and atlas-configurations is empty until
    # bootstrap seeds it via atlas-tenants. On a cold-start PR env (no
    # leftover tenant rows in Postgres) those four services CrashLoopBackOff
    # forever and Argo never declares the Sync phase Healthy, so PostSync
    # never fires. Classic chicken-and-egg.
    #
    # `Sync` hooks run *in parallel* with the sync wave's normal resource
    # apply, so bootstrap starts the moment Argo applies the manifests. The
    # bootstrap script (`scripts/bootstrap.sh`) already polls atlas-tenants
    # / atlas-configurations / atlas-data with `retry
    # 60 5` (5 minutes per dependency) before doing any work, so racing
    # with the Deployments coming up is fine — it just waits.
    #
    # `sync-wave: "10"` pins this hook to the same wave as the Deployments
    # (base/kustomization.yaml patches every Deployment to wave 10). Without
    # this, the Sync hook defaults to wave 0 and Argo gates wave 10 on
    # wave-0 completion — bootstrap polls for /api/tenants on a ClusterIP
    # whose backing Deployment has not yet been applied and times out after
    # 5 min. Cold-start incident 2026-05-16 task-063: PR 493 moved bootstrap
    # from PostSync to Sync but did not pin the wave, so cold starts of any
    # PR env deadlocked the same way PostSync did. Co-locating bootstrap
    # with the Deployments restores PR 493's intended parallel-apply: the
    # three provider services (tenants/configurations/data) do
    # not need tenant config to start, so they come up; bootstrap polls
    # them via atlas-ingress, seeds config, and bumps the four panicking
    # consumer services (channel/login/world/drops) via its RBAC.
    #
    # `BeforeHookCreation` ensures Argo deletes any prior Job from a
    # previous (possibly failed) sync before applying a new one. Without
    # this, a Failed Job from a half-completed sync wedges all subsequent
    # syncs with "spec.template: Invalid value … field is immutable"
    # because Argo tries to patch the immutable Job spec.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "10"
spec:
  # Wall-clock bound on the whole hook, all `backoffLimit` retries combined.
  #
  # WHY this exists: an Argo Sync-hook Job carries the runtime finalizer
  # `argocd.argoproj.io/hook-finalizer`, which only the application
  # controller removes, and only when the owning operation completes or
  # terminates. The operation's phase is in turn driven by this Job. If the
  # Job never reaches a terminal condition, the operation stays `Running`,
  # `resources-finalizer.argocd.argoproj.io` blocks on the undeletable Job,
  # and the entire namespace teardown deadlocks — 89 objects stuck with the
  # controller logging `N objects remaining for deletion` forever. Observed
  # on PR #1459, 2026-08-26; recovery required a manual finalizer patch
  # (see `docs/runbooks/ephemeral-pr-deployments.md` §9.4).
  #
  # A deadline breaks that cycle: the Job reaches terminal `Failed` even
  # when it is already under `deletionTimestamp` and pinned by the
  # finalizer, so the operation transitions and the controller reaps the
  # hook. Measured directly on this cluster (k3s v1.35.5+k3s1), not assumed.
  #
  # WHY 900 and not the retry budget: derived from 30 days of observed
  # bootstrap durations (n=104 successful runs — p50 68s, p95 162s, max
  # 542s). 900s is 1.66x the slowest successful run ever recorded, leaving
  # headroom for image pull and scheduling, which precede the first log
  # line and so are not in those figures. Re-derive with the LogQL recipe
  # in runbook §9.6 before changing it.
  #
  # WHY on `spec` and not `spec.template.spec`: the Job-level field bounds
  # the aggregate lifetime across all `backoffLimit: 3` retries. The
  # pod-level field bounds each attempt independently and would permit
  # 4 x 900s of total hook lifetime, which defeats the purpose.
  activeDeadlineSeconds: 900
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: atlas-pr-bootstrap
      # ghcr-pull is a dockerconfigjson Secret carrying a GHCR PAT. Source
      # Secret lives in `argocd` namespace (cluster-infra repo) and is
      # auto-replicated into every atlas-pr-* namespace by Reflector. Needed
      # because the atlas-pr-bootstrap package on GHCR is private (every
      # other atlas-* package the cluster pulls is public).
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: bootstrap
          image: ghcr.io/chronicle20/atlas-pr-bootstrap/atlas-pr-bootstrap:latest
          command: ["/atlas/bootstrap.sh"]
          env:
            - name: ATLAS_UI_BASE
              value: http://atlas-ingress.atlas-pr-1605.svc.cluster.local
            - name: TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: atlas-pr-bootstrap-tenant
                  key: TENANT_ID
            - name: REGION
              valueFrom:
                configMapKeyRef:
                  name: atlas-pr-bootstrap-tenant
                  key: REGION
            - name: MAJOR_VERSION
              valueFrom:
                configMapKeyRef:
                  name: atlas-pr-bootstrap-tenant
                  key: MAJOR_VERSION
            - name: MINOR_VERSION
              valueFrom:
                configMapKeyRef:
                  name: atlas-pr-bootstrap-tenant
                  key: MINOR_VERSION
          envFrom:
            - configMapRef:
                name: atlas-env-tokens
