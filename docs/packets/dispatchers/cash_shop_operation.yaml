# errors — the reason byte every *_FAILED arm carries, resolved by
# ResolveCode(l, options, "errors", key). Read from each version's
# CCashShop::NoticeFailReason jump table; no template carried this table before
# task-206, so every failure resolved to 99.
#
# CONFIDENCE. The BYTES are read from the jump table and are real. Most KEY
# NAMES are ordinal alignment of the case list against the declared order of
# the CashShopOperationError* constants, pinned by three anchors per version
# (see docs/tasks/task-206-cash-shop-coupon-codes/derivation.md). Rows marked
# `verified` there have direct evidence; rows marked `aligned` do not.
# Encoding an aligned byte is safe — the client renders a notice for it — but
# do not restate an aligned row as verified anywhere.
#
# RESERVED, DO NOT SEND as a generic failure. Every version has a
# "notice then change client state" pair (or trio) that OnCashItemResUseCoupon-
# Failed intercepts before the notice switch ever runs:
#   gms_v48 112/114 · gms_v61 127/129 · gms_v72 140/142 · gms_v79 154/156 ·
#   gms_v83 162/164 · gms_v84 171/173 · gms_v87 177/179 · gms_v92 0/2 ·
#   gms_v95 0/2 · jms_v185 177/179   -> notice + SendTransferFieldPacket
#                                       (kicks the player out of the cash shop)
#   gms_v83 177 · gms_v84 186 · gms_v87 192 · gms_v92 15 · gms_v95 15
#                                    -> wrong-coupon-number notice + OnStatusExit
# gms_v48/61/72/79 and jms_v185 have NO second (disconnect) byte — their
# UseCouponFailed else-arm is a plain notice. None of these bytes is mapped to
# an Atlas key here.
#
# UNKNOWN_ERROR is deliberately ABSENT: it is the jump table's default case on
# every version, i.e. "any byte not listed here". Mapping it to a specific byte
# would be wrong.
#
# gms_v92 and gms_v95 renumber the whole enum to a 1-based scale
# (reason = v83 reason - 162) and drop CANNOT_BE_PURCHASED_WHEN_UNDER_SEVEN /
# CANNOT_BE_RECEIVED_WHEN_UNDER_SEVEN out of the switch domain entirely (the
# `cmp eax, 44h` caps it at 69) — those two keys omit both columns.
#
# jms_v185 is DELIBERATELY PARTIAL — 30 of the 53 keys, bytes 178-211
# (0xB2-0xD3). The global constant-offset proof that carries v84/v87/v92/v95
# FAILS on jms (its switch domain is 178-237, 60 cases with a 13-member default
# set, which is not v83+15 under any offset); only set-equality on the
# sub-domain [178,211] holds, and that is the extent of what is declared. All
# ten coupon-specific keys fall inside the mapped range, so coupon redemption
# is fully covered. The 23 keys with NO jms_v185 entry are:
#   ONLY_AVAILABLE_TO_USERS_BUYING, ALREADY_APPLIED, DAILY_PURCHASE_LIMIT,
#   COUPON_USAGE_LIMIT, COUPON_SYSTEM_AVAILABLE_SOON, FIFTEEN_DAY_LIMIT,
#   NOT_ENOUGH_GIFT_TOKENS, CANNOT_SEND_TECHNICAL_DIFFICULTIES,
#   CANNOT_GIFT_ACCOUNT_AGE, CANNOT_GIFT_PREVIOUS_INFRACTIONS,
#   CANNOT_GIFT_AT_THIS_TIME, CANNOT_GIFT_LIMIT,
#   CANNOT_GIFT_TECHNICAL_DIFFICULTIES, CANNOT_TRANSFER_UNDER_LEVEL_TWENTY,
#   CANNOT_TRANSFER_TO_SAME_WORLD, CANNOT_TRANSFER_TO_NEW_WORLD,
#   CANNOT_TRANSFER_OUT, CANNOT_TRANSFER_NO_EMPTY_SLOTS,
#   EVENT_ENDED_OR_CANT_BE_FREELY_TESTED, CANNOT_BE_PURCHASED_WITH_MAPLE_POINTS,
#   PLEASE_TRY_AGAIN, CANNOT_BE_PURCHASED_WHEN_UNDER_SEVEN,
#   CANNOT_BE_RECEIVED_WHEN_UNDER_SEVEN.
# They are UNRESOLVED, not absent-by-design: above jms 211 the case set
# diverges from v83+15 (16 explicit cases against 23 keys), offset derivation
# is barred by the failed set-equality, and JMS ships its own string table so
# the StringPool ids cannot be cross-mapped from GMS. Closing them needs a JMS
# String.wz / StringPool dump, which this repo does not have. DO NOT complete
# this column by guessing or by offsetting — see derivation.md §jms_v185
# "Unresolved Atlas keys (23)" for the 16 raw tail cases recorded for a future
# pass.
#
# gms_v48/gms_v61/gms_v72/gms_v79 were added by task-206 Task 9. The constant-
# offset proof that carries v84/v87/v92/v95 FAILS on all four (their switch
# domains are 113-155, 128-179, 141-199 and 155-222, and none is v83's 163-233
# under any offset), so NOTHING is offset-derived here. Each version's case
# bodies were read individually for their StringPool id and aligned ordinally
# against v83's 53-case list, pinned by two independent per-version anchors —
# the OnStatusCoupon cash-shop-disabled gate (v48 137, v61 153, v72 170,
# v79 184 -> CASH_SHOP_NOT_AVAILABLE_DURING_BETA) and the inline literal
# "The coupon system will be available soon." (v48 143, v61 167, v72 185,
# v79 199 -> COUPON_SYSTEM_AVAILABLE_SOON) — plus id-block delta-pattern
# matching for the gaps. Case counts: v48 40, v61 43, v72 49, v79 53 (v79 is
# a complete 1:1 with v83). Keys absent from a version have no entry:
#   v48 (13 absent): CANNOT_GIFT_TO_OWN_ACCOUNT, INCORRECT_NAME,
#     CANNOT_GIFT_GENDER_RESTRICTION, CANNOT_GIFT_RECIPIENT_INVENTORY_FULL,
#     COUPON_CANNOT_BE_GIFTED, DAILY_PURCHASE_LIMIT, COUPON_USAGE_LIMIT,
#     CANNOT_TRANSFER_NO_EMPTY_SLOTS, EVENT_ENDED_OR_CANT_BE_FREELY_TESTED,
#     CANNOT_BE_PURCHASED_WITH_MAPLE_POINTS, PLEASE_TRY_AGAIN,
#     CANNOT_BE_PURCHASED_WHEN_UNDER_SEVEN, CANNOT_BE_RECEIVED_WHEN_UNDER_SEVEN
#   v61 (10 absent): the same list minus COUPON_CANNOT_BE_GIFTED,
#     DAILY_PURCHASE_LIMIT and COUPON_USAGE_LIMIT
#   v72 (4 absent): CANNOT_BE_PURCHASED_WITH_MAPLE_POINTS, PLEASE_TRY_AGAIN,
#     CANNOT_BE_PURCHASED_WHEN_UNDER_SEVEN, CANNOT_BE_RECEIVED_WHEN_UNDER_SEVEN
#   v79: none
# Absent means "this version's switch has no case for it", proven by full
# case enumeration — not "unknown". See derivation.md §gms_v48/61/72/79.
