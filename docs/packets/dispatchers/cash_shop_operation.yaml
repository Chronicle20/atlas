# CashShopOperation — CCashShop::OnCashItemResult per-version mode table.
#
# SOURCE OF TRUTH for the tenant template `operations` map of the
# CashShopOperation writer. `packet-audit operations` generates and validates
# template_<ver>_1.json writer.options.operations against this file. Each mode
# is the leading Decode1 switch case in that version's CCashShop::OnCashItemResult
# (clientbound). Modes shift NON-uniformly per version (sub-ops inserted), so a
# value is read from that version's IDB, not offset-derived.
#
# IDA-verified across all 9 tenant versions: gms_v83 (port 13342), gms_v87
# (13341), gms_v95 (13340), jms_v185 (13339) — all four via direct dispatcher
# decompile. gms_v84 is now ALSO directly RE'd (IDA session 79511a2a; real
# dispatcher located at 0x47c291 after a naming trap — see
# docs/tasks/task-183-cashshop-result-family/arm-catalog.md §4) — it is NO
# LONGER template-derived/assumed-uniform-+3-vs-v83; v84 has 6 arms (the 4
# GACHAPON_* + 2 CHANGE_MAPLE_POINT_* keys) that v83 lacks entirely, which a
# pure +3 offset would have silently mis-derived as absent. The four legacy
# versions gms_v48 (session 0bb5f11a), gms_v61 (965202bf), gms_v72
# (90e36cb0), and gms_v79 (9a7d3642) were harvested in task-183 Wave 0 and are
# now included below for full 9-version coverage (57 arms total; 48 newly
# added beyond the original 9).
#
# Per-version presence varies — an arm absent from a given version's switch
# (proven by full case/range enumeration in the harvest reports under
# .superpowers/sdd/task-0.4-*-modes.md and task-0.5-*-modes.md) has NO key
# for that version in its `modes` map below (absence = n-a; never an
# explicit "n-a" value, matching this tool's convention). See
# docs/tasks/task-183-cashshop-result-family/arm-catalog.md for the full
# per-arm/per-version hex table and wire-shape divergence notes (reason-code
# renumbering, legacy structural folds, etc.) that are NOT captured by the
# mode-byte-only map below.

