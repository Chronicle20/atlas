note: >-
    REMOVE_DRAGON (opcode 189, 0xBD) is routed but unhandled on JMS185.
    CUser::OnDragonPacket @0x9f822f only handles nType==0xBB (187, spawn) and
    v7&&nType==0xBC (188, move); there is no case for 0xBD. The outer
    dispatcher CUserPool::OnUserCommonPacket @0xa440d7 routes the range
    v5>=187 && v5<=189 into OnDragonPacket, so 189 enters the function and
    falls through both branches with zero effect — no field is read, no
    dragon state changes. Same routed-but-unhandled shape already recorded
    for gms_v83/v84/v87/v92/v95; the model note is
    docs/packets/registry/gms_v84.yaml:1254.
