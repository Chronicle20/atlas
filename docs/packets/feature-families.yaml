# Ops that together form one logical feature. Rule (enforced by
# `packet-audit matrix --check`): if ANY member is `verified` on a version, no
# member may be `n-a` on that version unless it carries positive absence
# evidence in docs/packets/feature-na-evidence.yaml. The receive side proves
# the send side. Add families here as related packets are verified.
families:
  teleport_rock:
    - USE_TELEPORT_ROCK
    - TROCK_ADD_MAP
    - MAP_TRANSFER_RESULT
  claim:
    - CLAIM_REQUEST
    - CLAIM_RESULT
    - CLAIM_AVAILABLE_TIME
    - CLAIM_STATUS_CHANGED
  cash_item_gachapon:
    - CASH_ITEM_GACHAPON_BUTTON
    - CASHSHOP_CASH_ITEM_GACHAPON_RESULT
  dragon:
    - SPAWN_DRAGON
    - MOVE_DRAGON
    - REMOVE_DRAGON
  skill_macro:
    - SKILL_MACRO
    - MACRO_SYS_DATA_INIT
  back_effect:
    - SET_BACK_EFFECT
    - CLEAR_BACK_EFFECT
