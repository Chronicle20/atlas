# A cell listed here is `n-a` for an op while a same-family sibling is `verified`
# on the same version. Each MUST carry POSITIVE absence evidence (a proof the op
# does not exist — e.g. the opcode slot is a different op, a binary-wide search
# for the op's construction/gate found nothing, the receive handler lacks the
# feature branch). A failed name/region search is NOT evidence. This list only
# shrinks (verify the cell, or keep the proven-absent entry). See
# docs/packets/audits/VERIFYING_A_PACKET.md "Is this cell n-a?".
entries:
  - op: USE_TELEPORT_ROCK
    version: gms_v48
    evidence: >
      v48 has no distinct regular-rock USE_TELEPORT_ROCK op. Binary-wide search
      for the itemId/10000==232 gate found zero hits; all three item-use
      dispatchers route category 232 to no teleport sender; the map-transfer
      dialog ctor (sub_60BCB3) is opened only via the generic UI-panel opener
      sub_70C29F (panel 0), not by a regular-rock item-use. Teleport-rock use on
      v48 rides the cash-item op (USE_CASH_ITEM); list-management (TROCK_ADD_MAP
      0x51) and result (MAP_TRANSFER_RESULT 0x23) are present. (task-124)
  - op: CLAIM_REQUEST
    version: jms_v185
    evidence: >
      jms_v185 has no CLAIM_REQUEST send-site anywhere in the binary, checked five
      independent ways and confirmed genuinely exhaustive over every code path that
      constructs/sends an outgoing packet: (1) name/UI search for SendClaimRequest,
      CUIClaim, SendClaim — no hit (CUIMessenger/CUIStatusBar are both substantially
      named with no SendClaim member); (2) exhaustive scan of all 35 `push 101`
      (0x65) instructions in .text — none precedes the long-opcode COutPacket ctor;
      (3) exhaustive scan of all 577 COutPacket::COutPacket(long) call sites
      (the entire jms serverbound opcode space, not just opcode 101) — the 81 inside
      CField::SendChatMsgSlash use only opcodes 0x83/0x78/0x89/0xdd/0x84/0xe1/0x29,
      none matching claim's 2xEncode1+2-3xEncodeStr bChatClaim-gated shape;
      (4) exhaustive scan of all 504 CClientSocket::SendPacket call sites (0 tail
      calls) with all 35 unnamed (sub_XXXXXX) callers individually decompiled —
      none matches; (5) mandatory sibling cross-check: the clientbound
      OnClaimResult/OnSetClaimSvrAvailableTime/OnClaimSvrStatusChanged trio IS
      live-routed from CWvsContext::OnPacket's compiled switch (cases 0x2A/0x2B/0x2C
      @ 0xaebfe7) — confirming the receive side exists and is reachable — yet no
      corresponding send-site was found anywhere. jms_185 ships the shared
      receive-side network code for claim results but the client-side trigger
      (the report/claim UI) was removed or never wired for this build; the send
      op does not exist to verify. Method validated against gms_v92's known-good
      SendClaimRequest (0x9d9c30) before being applied to jms. (task-145 §7.3,
      task-24 disposition)
  - op: CASHSHOP_CASH_ITEM_GACHAPON_RESULT
    version: gms_v48
    evidence: >
      Three independent proofs (task-207, design.md §1.1/§1.6), live-IDB
      re-confirmed on session 93cc947e: (1) no CUICashItemGachapon class
      exists anywhere in the v48 binary (func_query name_regex
      "CUICashItemGachapon|OnCashItemGachaponResult" over the whole image
      returns only the CCashShop stub below — zero CUICashItemGachapon hits);
      (2) the opcode's handler, CCashShop::OnCashItemGachaponResult
      (0x4536b9), is a 3-line stub — `CInPacket::Decode1(a2)` written straight
      into `*(g_pWvsContext + 8257)`, a CWvsContext flag byte, not a gachapon
      reward read (no sn/remain/blob/itemId/count/jackpot fields); (3)
      `GET /api/data/cash/items/5222000` against the live baseline returns 404
      on gms_v48 (200 on v79+). Mandatory sibling cross-check: the serverbound
      CASH_ITEM_GACHAPON_BUTTON send site is likewise absent from v48 (no
      CUICashItemGachapon::OnButtonClicked anywhere) — both directions are
      absent together, consistent with the feature not existing on this
      client, not a one-sided gap.
  - op: CASH_ITEM_GACHAPON_BUTTON
    version: gms_v48
    evidence: >
      Same three proofs as the CASHSHOP_CASH_ITEM_GACHAPON_RESULT × gms_v48
      entry above (task-207): no CUICashItemGachapon class in the binary, the
      CCashShop::OnCashItemGachaponResult handler is a 3-line CWvsContext-flag
      stub unrelated to the gachapon reward wire, and item 5222000 404s from
      the live atlas-data baseline on this tenant. Mandatory sibling
      cross-check: the clientbound result handler is the CWvsContext-flag stub
      above, not a gachapon result — both sides absent together.
