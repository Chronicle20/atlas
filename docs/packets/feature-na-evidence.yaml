  - op: CASHSHOP_CASH_ITEM_GACHAPON_RESULT
    version: gms_v79
    evidence: >
      task-207 live-IDB re-confirmed on session 1438cecd: (1)
      CCashShop::OnPacket (0x471da6) enumerates opcodes 301-309 with cases for
      OnChargeParamResult/OnQueryCashResult/OnCashItemResult/
      OnPurchaseExpChanged/OnCheckDuplicatedIDResult/
      OnCheckNameChangePossibleResult/OnCheckTransferWorldPossibleResult/
      OnCashShopGachaponStampResult (cases 301-306, 308, 309) — no
      CashItemGachaponResult case anywhere, and no such function exists in the
      binary at all (func_query over CCashShop/CUICashItemGachapon finds zero
      OnCashItemGachaponResult hits, unlike v48/v61/v72's stub); (2)
      CCashShop::OnCashItemResult (0x4720ed) enumerates 47 sub-modes
      (0x3F-0x99) with no gachapon arm; (3) CUICashItemGachapon::Update
      (0x8ef7ce) renders the reward from `*((_DWORD*)this + 39)`
      (m_nSelectedItemID) via CItemInfo::GetItemName/GetItemIcon, gated by
      CWvsContext::SetExclRequestSent — nothing else in the binary writes that
      field, i.e. the client has no wire path that populates the reward it
      would render. Scope caveat (verbatim, per playbook): the two cash-shop
      dispatch tables (OnPacket's opcode switch and OnCashItemResult's mode
      switch) are the complete set of CCashShop clientbound entry points, but
      a result arriving through a wholly unrelated router was not
      exhaustively excluded. Mandatory sibling cross-check: the serverbound
      CASH_ITEM_GACHAPON_BUTTON send is verified live on v79
      (CUICashItemGachapon::OnButtonClicked @ 0x8efda6, COutPacket(0x9F) +
      EncodeBuffer 8) — the request path is real and reaches the server, but
      no client-side result handler exists to receive a reply, which is
      exactly the family-inconsistent n-a this evidence file exists to prove.
  - op: BRIDLE_MOB_CATCH_FAIL
    version: gms_v48
    evidence: >
      gms_v48 has no BRIDLE_MOB_CATCH_FAIL receive handler. CWvsContext::OnPacket
      @0x70d215 is a complete compiled switch over cases 25-70 with no bridle-fail
      arm; the four unnamed arms were individually decompiled and ruled out —
      sub_72025D (case 58, a delegating stub), sub_713202 (case 62), sub_721481
      (case 68, a two-byte + optional-string notice) and sub_7215EA (case 70, the
      same shape). The v48 IDB is symbol-rich across CWvsContext (mangled MSVC
      names throughout) and CWvsContext::SendBridleItemUseRequest @0x70e0c5 IS
      named, while OnBridleMobCatchFail is absent from the class entirely. v61
      has it (@0x8307f3, named), so this is a v48-only absence: v48 sends catch
      requests but has no server-driven failure notice. The sibling clientbound
      catch packets DO exist on v48 (CATCH_MONSTER 0x0AC, CATCH_MONSTER_WITH_ITEM
      0x0AD via CMobPool::OnMobPacket @0x559390 cases 172/173). (task-212)
