# Version-gated wire-divergence registry (task-169 FR-3.1b)
#
# A machine-readable list of the places where a packet's wire encoding changes
# at a client-version boundary. `packet-audit gate-check` asserts that a
# VERIFIED byte-fixture pins the encoding on BOTH adjacent versions that straddle
# each boundary — a gate is only trustworthy if both sides are proven, so a
# regression (or a wrong boundary) on the unpinned side can't slip through.
#
# This is a REPRESENTATIVE seed, not an exhaustive list. It was seeded from
# task-113's docs/tasks/task-113-gms-legacy-versions/code-gate-audit.md (the
# cross-version gate table), picking the clearest gates whose two straddling
# versions are BOTH fixture-verified today. Extend it freely — it only grows.
#
# HOW TO ADD A ROW
#   1. Find the version-gated branch in libs/atlas-packet (grep MajorVersion /
#      MajorAtLeast). Identify the boundary and the two ADJACENT version keys
#      that straddle it — one takes the branch, the other doesn't.
#   2. Set `packet` to the status.json `packet` field for that codec (e.g.
#      `character/clientbound/CharacterSpawn`) and `direction` to disambiguate.
#   3. Confirm BOTH straddling keys are `verified` in
#      docs/packets/audits/status.json. If one side legitimately isn't pinned
#      yet, set `expect: partial` and a `reason` (do NOT fabricate a fixture) —
#      gate-check will accept one verified side but keep the gap visible.
#
# SCHEMA (per gate)
#   packet:            status.json `packet` path (maps the gate to a matrix row)
#   direction:         clientbound | serverbound (disambiguates duplicate paths)
#   field:             short human note of what the boundary gates
#   boundary:          the code predicate, e.g. ">87" or ">=95"
#   lower_version_key: adjacent version on the LOW side of the boundary
#   upper_version_key: adjacent version on the HIGH side of the boundary
#   expect:            full (default) | partial  (partial => one side may be unpinned)
#   reason:            required when expect: partial
#
# Adjacency note: lower/upper are the two version columns that touch the
# boundary; gate-check only inspects those two cells, so intervening n-a columns
# don't matter.

gates:
  # ---- boundary v48 / v61 ------------------------------------------------
  - packet: character/clientbound/CharacterSpawn
    direction: clientbound
    field: new-year-card flag (present v61+, absent v48; `>=61 && <95`)
    boundary: ">=61"
    lower_version_key: gms_v48
    upper_version_key: gms_v61

  # ---- boundary v61 / v72 ------------------------------------------------
  - packet: login/serverbound/WorldCharacterListRequest
    direction: serverbound
    field: socketAddr int (added at v72; `(>=72)||JMS`)
    boundary: ">=72"
    lower_version_key: gms_v61
    upper_version_key: gms_v72
  - packet: character/serverbound/CreateCharacter
    direction: serverbound
    field: manual base-stat trailing bytes (present <=v61; `<=61`)
    boundary: "<=61"
    lower_version_key: gms_v61
    upper_version_key: gms_v72

  # ---- boundary v72 / v79 ------------------------------------------------
  - packet: character/serverbound/CreateCharacter
    direction: serverbound
    field: jobIndex (read at v73+; the sole intra-legacy discriminator; `>=73`)
    boundary: ">=73"
    lower_version_key: gms_v72
    upper_version_key: gms_v79

  # ---- boundary v79 / v83 ------------------------------------------------
  - packet: character/clientbound/CharacterSpawn
    direction: clientbound
    field: 2nd (dragon) effect byte (present v83..v87; `>=83 && <=87`)
    boundary: ">=83"
    lower_version_key: gms_v79
    upper_version_key: gms_v83

  # ---- boundary v83 / v84 ------------------------------------------------
  - packet: character/serverbound/CharacterAttackMeleeRequest
    direction: serverbound
    field: attack_info DR-block fields (added at v84; `>=84`)
    boundary: ">=84"
    lower_version_key: gms_v83
    upper_version_key: gms_v84
  - packet: monster/serverbound/MonsterMovementRequest
    direction: serverbound
    field: monster-move v84 fields (`>=84`)
    boundary: ">=84"
    lower_version_key: gms_v83
    upper_version_key: gms_v84

  # ---- boundary v84 / v87 ------------------------------------------------
  - packet: chat/serverbound/ChatWhisper
    direction: serverbound
    field: v87 whisper decode path (`(>=87)||JMS`)
    boundary: ">=87"
    lower_version_key: gms_v84
    upper_version_key: gms_v87
  - packet: login/serverbound/AllCharacterListRequest
    direction: serverbound
    field: view-all-char v87 field (`>=87`)
    boundary: ">=87"
    lower_version_key: gms_v84
    upper_version_key: gms_v87
  - packet: character/clientbound/CharacterInfo
    direction: clientbound
    field: char-info v87 field (`(GMS && >=87)||JMS`)
    boundary: ">=87"
    lower_version_key: gms_v84
    upper_version_key: gms_v87
  - packet: monster/clientbound/MonsterMovement
    direction: clientbound
    field: monster-movement v87 fields (`(>=87)||JMS`)
    boundary: ">=87"
    lower_version_key: gms_v84
    upper_version_key: gms_v87

  # ---- boundary v87 / v92 ------------------------------------------------
  - packet: monster/clientbound/MonsterDestroy
    direction: clientbound
    field: dead-type-4 trailing swallowCharacterId (read v92+; `(GMS>=92)||JMS`)
    boundary: ">=92"
    lower_version_key: gms_v87
    upper_version_key: gms_v92

  # ---- boundary v87 / v95 ------------------------------------------------
  - packet: character/clientbound/CharacterSpawn
    direction: clientbound
    field: v88+ spawn field (`>87`)
    boundary: ">87"
    lower_version_key: gms_v87
    upper_version_key: gms_v95
  - packet: character/clientbound/CharacterInfo
    direction: clientbound
    field: char-info legacy field (present <=v87; `<=87`)
    boundary: "<=87"
    lower_version_key: gms_v87
    upper_version_key: gms_v95
  - packet: character/clientbound/ItemUpgrade
    direction: clientbound
    field: item-upgrade v88+ fields (`>87`)
    boundary: ">87"
    lower_version_key: gms_v87
    upper_version_key: gms_v95
  - packet: character/clientbound/CharacterExpression
    direction: clientbound
    field: expression v88+ fields (`>87`)
    boundary: ">87"
    lower_version_key: gms_v87
    upper_version_key: gms_v95
  - packet: character/clientbound/CharacterViewAllCharacters
    direction: clientbound
    field: view-all v88+ field (`>87`)
    boundary: ">87"
    lower_version_key: gms_v87
    upper_version_key: gms_v95
  - packet: character/clientbound/CharacterList
    direction: clientbound
    field: char-list v88+ field (`>87`)
    boundary: ">87"
    lower_version_key: gms_v87
    upper_version_key: gms_v95
  - packet: field/clientbound/FieldSetField
    direction: clientbound
    field: set-field v95 field (`>=95`)
    boundary: ">=95"
    lower_version_key: gms_v87
    upper_version_key: gms_v95
  - packet: character/clientbound/CharacterDamage
    direction: clientbound
    field: damage v95 fields (`>=95`)
    boundary: ">=95"
    lower_version_key: gms_v87
    upper_version_key: gms_v95

  # ---- boundary v92 / v95 ------------------------------------------------
  - packet: chat/serverbound/ChatMulti
    direction: serverbound
    field: v95 leading Encode4(updateTime) (`GMS && >=95`)
    boundary: ">=95"
    lower_version_key: gms_v92
    upper_version_key: gms_v95
    expect: partial
    reason: >-
      task-146 Task 13: gms_v92 side of the boundary has no verified
      byte-fixture for ChatMulti yet — no gms_v92 evidence record exists for
      this packet. Only the gms_v95 side is pinned by this task; the v92
      fixture is deliberately not fabricated to close the gate.


# TODO(task-183 Wave 2, re-diagnosed): cash/clientbound/CashGiftDone and
# cash/clientbound/CashGiftPackageDone are now fixture-verified on ALL 5
# modern versions, including the region branch on both gms_v95 (has
# nxCashSpent) and jms_v185 (omits it — confirmed live via decompile of
# sub_48D3CE@0x48d3ce and OnCashItemResGiftPackageDone@0x48c79a in this
# session). A gate row was ATTEMPTED for both packets
# (boundary region==GMS, lower gms_v95, upper jms_v185, expect: full) but
# `gate-check --check` rejects both with "no matrix row for packet ..." —
# NOT a missing-fixture problem `expect: partial` can paper over (that only
# relaxes which SIDE must be verified; here neither side ever resolves to a
# row at all, so evalGate's configErr path fires regardless of expect).
#
# Root cause (tools/packet-audit/internal/matrix/build.go): CASHSHOP_OPERATION
# is a single dispatcher registry op (one wire opcode, `CCashShop::
# OnCashItemResult`). Build() consumes EVERY report whose IDAName base-fname
# matches the dispatcher's FName (baseFName strips the "#ARM_KEY" suffix) as a
# *candidate* of that ONE op row (`usedWriters[vk][wn] = true` in
# worstCandidateCell) and folds all candidates' cells down to the worst state
# under one row annotated with a single representative `packet` (see
# rowPacketAndTier) — e.g. today that representative happens to be
# `cash/clientbound/CashCashItemMovedToCashInventory`. A report is only
# promoted to its own "sub-struct" row when its fname is NOT claimed by any op
# row (build.go's `sub` map, populated from `!usedWriters[vk][wn]`) — which
# never happens for a dispatcher arm. Confirmed this is not specific to
# GiftDone/GiftPackageDone or to this batch: NONE of the 20 previously
# verified arms (CashBuyFailed, CashGiftPackageFailed, etc., Wave 2 batches
# 1-3) appear anywhere in status.json either — zero occurrences of
# "CashBuyFailed" in docs/packets/audits/status.json even though it has
# carried a `packet-audit:verify` marker + pinned evidence since the pilot
# batch. So no per-arm dispatcher-arm packet can EVER satisfy gate-check's
# `for _, row := range m.Rows { if row.Packet != g.Packet { continue } }`
# row-lookup as it exists today, verified or not, full family graduation or
# not (Wave 4 re-graduation only changes the op-row's own worst-cell state,
# it does not create per-arm rows).
#
# This needs a real design decision, not a mechanical unblock: either (a)
# teach gate-check to fall back to the evidence/marker ledger directly for
# packets with no matrix row (duplicating a slice of cmd/matrix.go's loading
# logic into gatecheck.go), or (b) gate on the dispatcher's own representative
# packet id instead of the arm, or (c) accept that intra-dispatcher
# region/version divergences are out of gate-check's model and rely solely on
# the byte-fixture test's own per-region assertion (already present:
# TestGiftDoneByteFixture / TestGiftPackageDoneByteFixture branch on
# v.Region == "GMS"). Leaving unregistered pending that decision — see
# docs/tasks/task-183-cashshop-result-family/ for the Wave 2 GIFT batch report.
