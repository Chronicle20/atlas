  # movement.go to it). PetItemUse was the one remaining pet serverbound
  # codec that still unconditionally read the leading petId; Task 15 is what
  # brings it into that same pattern. Listed here only so the critic doesn't
  # mistake "same helper, same directory" for this task having touched them.
  - pet/serverbound/PetCommand
  - pet/serverbound/PetChat
  - pet/serverbound/PetDropPickUp
  - pet/serverbound/PetMovement
