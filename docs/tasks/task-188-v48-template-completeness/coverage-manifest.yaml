  # verified — see fields[] for the per-gate evidence status.
  - gms_v48                                 # the task's column
  - gms_v61                                 # boundary decisions only
  - gms_v72                                 # boundary decisions only
  - gms_v79                                 # boundary decisions only

fields:
  - "cash/serverbound/shop_operation_increase_storage.go: currency Encode4 gated
     OFF for v48. VERIFIED — CCashShop::OnIncTrunkCount @0x44aad1 encodes three
     bytes, no Encode4; v83 @0x46c55b and v87 @0x4763e0 read the wider shape.
     v61/v72/v79 are UNRESOLVED (export carries an 'Unresolved' stub) and the
     gate deliberately excludes v48 only rather than guessing a boundary."

  - "field/clientbound/effect_weather.go: leading-bool gate moved from
     'less than 61' to 'equals 61'. VERIFIED for v48 (sub_4C930A reads Decode1
     @0x4c9328 BEFORE Decode4(itemId) @0x4c932e) and for v61 (sub_4ED39C
     @0x4ed39c reads Decode4 first, no leading byte). v72/v79 are NOT verified
     and remain on encodeGMS; flagged in the codec comment."

  - "reactor/clientbound/spawn.go: trailing reactor-name string gated at the
     v79/v83 boundary, NOT this task's v48/v61 line. VERIFIED on both sides —
     v48 @0x5a54b4, v72 @0x69207c, v79 @0x6b77bb read six fields and no name;
     v83 @0x735127, v84 @0x75271c, v87 @0x77af9c, v95 @0x6cf490 follow with a
     DecodeStr. This CHANGES v61/v72/v79 output: Atlas previously wrote all
     four legacy versions a trailing string their clients never read. No
     already-verified cell regressed (full matrix diff: zero non-v48 cell
     changes)."

  - "pet/serverbound/spawn.go: trailing 'lead' byte gated at v61. Bounds
     VERIFIED — absent v48 (CWvsContext::SendActivatePetRequest @0x71d118,
     two fields), present v72 (@0x91c241, Encode1(lead) @0x91c529), v87
     @0xabbb70 and v95 @0x9f6980 keep the three-field shape. The v61 placement
     itself is INFERRED and labelled as such in the codec: the v61 IDB names no
     equivalent send-site and gms_v61.yaml registers no serverbound SPAWN_PET,
     so no matrix cell depends on the choice. Re-derive before trusting it if a
     v61 tenant ever routes this op."

  - "model/monster.go, npc/clientbound/spawn.go, npc/clientbound/
     spawn_request_controller.go, login/clientbound/server_list_entry.go,
     field/clientbound/set_field.go: v48 field-presence gates, each pinned to
     per-version IDA addresses in the codec comments."

