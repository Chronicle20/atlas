# Coverage manifest for task-205 (player-to-player trade), Task 6.
#
# Declares every op x version cell this task claims, so `packet-completeness-critic`
# can diff it against the branch's git + matrix delta.
#
# NOTE ON PACKET IDS: the plan brief spelled the clientbound ops as
# `interaction/clientbound/InteractionTradePutItem`. The packet-audit tooling
# derives a packet id as `<family-dir>/<direction>/<Title(family)+StructName>`
# (`qualifiedWriterName`), so the struct `InteractionTradePutItem` in family
# `interaction` is addressed as `interaction/clientbound/InteractionInteractionTradePutItem`
# — the same double-prefix the already-verified sibling
# `interaction/clientbound/InteractionInteractionUpdateMerchant` carries. The
# tool-correct ids are used below; they name the same four codecs.
task: task-205-player-trade
ops:
  - interaction/clientbound/InteractionInteractionTradePutItem
  - interaction/clientbound/InteractionInteractionTradeAddMeso
  - interaction/clientbound/InteractionInteractionTradeConfirm
  - interaction/clientbound/InteractionInteractionTradeMesoLimit
  # Trade-room ENTER_RESULT variant — reuses the existing
  # InteractionEnterResultSuccess codec + interaction.Room via NewTradeRoom
  # (design 1.3: CTradingRoomDlg's vtable+72 tail is a nullsub, so the body is
  # exactly the CMiniRoomBaseDlg::OnEnterResultBase frame). No new codec, and
  # therefore no new matrix row: the cell it lives in is the
  # PLAYER_INTERACTION clientbound op row.
  - interaction/clientbound/InteractionInteractionEnterResultSuccess
  # Trade LEAVE statuses (2/7/8/9/12/13) — new tenant `leaveReason` keys only,
  # carried by the existing InteractionLeave codec. Same note as above.
  - interaction/clientbound/InteractionInteractionLeave
  # fname correction: CCashTradingRoomDlg::Trade -> CTradingRoomDlg::OnTrade.
  - interaction/serverbound/InteractionOperationTransaction
versions:
  - gms_v48
  - gms_v61
  - gms_v72
  - gms_v79
  - gms_v83
  - gms_v84
  - gms_v87
  - gms_v92
  - gms_v95
  - jms_v185
