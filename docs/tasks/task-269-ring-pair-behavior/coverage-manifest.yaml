  # codec/tests) — SPAWN_PLAYER / CUserPool::OnUserEnterField. Carries the
  # RingSet field block (couple/friendship pair arms + marriage triple) at
  # the same wire position across every target version; no version gate on
  # the arm shape itself (design.md §2 OQ-1).
  - character/clientbound/CharacterSpawn

  # character/clientbound/CharacterInfo (Task 2 codec/tests) — CHAR_INFO /
  # CWvsContext::OnCharacterInfo. Carries the RingRecords history block
  # (CoupleRecord/FriendRecord/MarriageRecord arrays), gated off entirely on
  # the legacy GMS<=28 boundary (see fields: below).
  - character/clientbound/CharacterInfo

  # character/clientbound/CharacterAppearanceUpdate (Tasks 6/13/14) —
  # UPDATE_CHAR_LOOK / CUserRemote::OnAvatarModified ("Site C"). Task 6
  # corrected the frame (four trailing bytes removed vs. the pre-task
  # encoder) so the ring block reads at the right wire position; Task 13/14
  # re-pinned evidence and retired the both-sides EncodeField tautology in
  # the byte-fixture tests. This is the op that makes ring state update
  # live within a map on equip/unequip (kafka/consumer/asset/consumer.go,
  # ringProcessorFn / GetRingSet), not just at spawn.
  - character/clientbound/CharacterAppearanceUpdate

  # character/CharacterData (Task 3 derivation, Tasks 4/5/6/10/11 codec/
  # tests) — the opaque per-character data span carried inside
  # field/clientbound/FieldSetField (SET_FIELD / CStage::OnSetField). Not
  # its own status.json op row (see out_of_scope: below); carries the same
  # RingRecords history block as CharacterInfo.
  - character/CharacterData

