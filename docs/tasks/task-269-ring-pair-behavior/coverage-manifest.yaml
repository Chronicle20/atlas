  - wedding/clientbound/*
  - spouse-chat/*

  # Ruling 4 — a wrong-comment defect in four checked-in IDA exports,
  # discovered during Task 1's derivation. gms_v83.json's and gms_v87.json's
  # and gms_v95.json's CUserRemote::OnAvatarModified entries misname the
  # trailing 4-byte couple/friendship field as dwPairCharacterId /
  # dwFriendCharacterId; it is actually nItemID (the ring item template id
  # — see fields: above). gms_jms_185.json's CUserRemote::OnAvatarModified
  # entry at the same address makes the SAME wrong claim ("pair
  # characterId (per entry)" / "friendship pair characterId (per entry)"),
  # even though that same export's OWN CUserRemote::Init entry states the
  # correct name ("couple-ring itemId (per entry)"). Plan Task 1 Step 6
  # forbids hand-editing a checked-in export; fixing this requires an
  # IDB-comment change plus a `packet-audit export` regeneration, which is
  # out of this branch's scope. Addresses:
  #   - gms_v83.json  @0x98367e  (CUserRemote::OnAvatarModified)
  #   - gms_v87.json  @0xa090f4  (CUserRemote::OnAvatarModified)
  #   - gms_v95.json  @0x954110 (CUserRemote::OnAvatarModified)
  #   - gms_jms_185.json @0xa57221 (CUserRemote::OnAvatarModified)
  - ida-export-comment-defect: [gms_v83.json@0x98367e, gms_v87.json@0xa090f4, gms_v95.json@0x954110, gms_jms_185.json@0xa57221]

  # Ruling 36 — a PRE-EXISTING defect from PR #971 / commit 3d77511d0,
  # predating this branch, discovered incidentally in Task 14's re-pin
  # sweep. gms_v48's CharacterSpawn packet-audit:verify marker
  # (libs/atlas-packet/character/clientbound/spawn_test.go:100) and its
  # evidence record (docs/packets/evidence/gms_v48/
  # character.clientbound.CharacterSpawn.yaml) cite the UNNAMED
  # `sub_6BBC17` rather than the export's own named handler
  # `CUserPool::OnUserEnterField` (@0x6b277b). `sub_6BBC17` was confirmed
  # to be a CALLEE reached from that handler, so the v48 ✅ disposition
  # itself is not bogus — only the ida function-name citation is wrong.
  # The test file's doc comment additionally attributes the marker to
  # `CUserRemote::Init`, a name that does not exist anywhere in the v48
  # export. Not fixed here — recorded as a pre-existing citation defect,
  # not a task-269 regression.
  - ida-citation-defect: [gms_v48/spawn_test.go:100, docs/packets/evidence/gms_v48/character.clientbound.CharacterSpawn.yaml]

residual:
  # Seven ring-record fields whose semantics beyond "type-only" IDA
  # evidence are unverified (ring-field-derivation.md §"What would settle
  # this"): couple/friend dwPairCharacterID (that the value really is a
  # character id, not merely typed as one), friend dwFriendItemID (that
  # the value really is a ring item template id), marriage dwMarriageNo,
  # usStatus, nBrideItemID, sGroomName, sBrideName. All are populated by
  # this branch's codec per the "nothing reads it back on the exported
  # sites" evidence gathered in Task 1/3's derivation, but none has a
  # live-capture or reference-implementation cross-check. Declared as an
  # accepted residual, not re-investigated by Task 15.

  # Ruling 17 / A3 — FR-8's intended v28 boundary is untested. character/
  # clientbound/info.go's legacy record-block gate is
  # `t.Region()=="GMS" && t.MajorVersion()>28 && t.MajorVersion()<61`,
  # which EXCLUDES v28 itself (the gate only fires strictly above 28), so
  # no test at the branch exercises the exact v28 edge; gms_v48 was
  # substituted throughout this branch's legacy-gate tests as the nearest
  # covered version inside the gated range.

  # PRD FR-12 residual (Task 15 Step 2, recorded in
  # services/atlas-channel/docs/kafka.md, EVENT_TOPIC_ASSET_STATUS
  # section): Site C (CharacterAppearanceUpdate) is now live, so ring
  # state updates within a map on equip/unequip. The remaining residual
  # case — a ring purchased by a partner already standing on your map —
  # resolves when that partner equips it (their own subsequent EQUIP
  # command re-derives RingSet from the RING_PURCHASED-invalidated cache
  # and broadcasts), not from the purchase event alone; RING_PURCHASED
  # itself only invalidates both halves' ring caches
  # (kafka/consumer/cashshop/consumer.go handleStatusEventRingPurchased).

  # Task 3 — the CoupleRecord/FriendRecord/MarriageRecord name fields'
  # 12-byte (recordNameWidth-1) truncation boundary is not independently
  # byte-pinned at the exact 13-byte input edge; writeRecordName truncates
  # by BYTE, not RUNE (pre-existing behavior for any non-ASCII name,
  # unrelated to this branch).

  # Task 9 — libs/atlas-packet/*/model.go:73,80,88 doc comments cite
  # atlas-cashshop line ranges that were never independently re-verified
  # against atlas-cashshop's current source by this branch (cosmetic).

  # Task 12 — kafka/consumer/session/consumer.go:217's Populate wiring
  # (ring cache population on character load) has no dedicated test;
  # accepted, matching that file's documented practicality boundary for
  # processStateReturn's other side effects.

