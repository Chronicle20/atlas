fields:
  - "character/clientbound/CharacterSpawn, character/clientbound/CharacterAppearanceUpdate: RingSet field block (libs/atlas-packet/model/ring.go EncodeField/DecodeField) — couple-pair arm [flag byte; if 1: (JMS only) entry-count Int=1, own SN Int64, partner SN Int64, item template id Int], friendship-pair arm (identical shape), then marriage arm [flag byte; if 1: subject's own character id Int, partner character id Int, wedding ring item template id Int]. All-nil RingSet writes exactly three zero flag bytes, byte-identical to the pre-task encoder (PRD FR-9). No version gate inside the block itself; the only branch is GMS-vs-JMS (JMS adds the per-arm entry-count int, always 1). PairRing's trailing field is the ring's item TEMPLATE id (nItemID), not a pair character id — design.md §3.1's original naming is refuted (ring-field-derivation.md verdict)."
  - "character/clientbound/CharacterInfo, character/CharacterData: RingRecords history block (model/ring.go CoupleRecord/FriendRecord/MarriageRecord) — CoupleRecord (33 bytes/0x21): pairCharacterId Int(4) + pairCharacterName char[13] (writeRecordName: truncated to 12 bytes + at least one zero pad byte, never the full-width WritePaddedString) + ownSN Int64(8) + pairSN Int64(8). FriendRecord (37 bytes/0x25): CoupleRecord shape + friendItemId Int(4). MarriageRecord (48 bytes/0x30): marriageNo Int(4) + groomId Int(4) + brideId Int(4) + status Short(2) + groomItemId Int(4) + brideItemId Int(4) + groomName char[13] + brideName char[13]. Gated off entirely (all three record arrays empty) on the legacy boundary character/clientbound/info.go: `t.Region()==\"GMS\" && t.MajorVersion()>28 && t.MajorVersion()<61` (Ruling 17/A3 below — this EXCLUDES v28 itself, so v28 has no substitute test at that exact boundary; v48 was substituted as the nearest covered legacy-gate version)."

