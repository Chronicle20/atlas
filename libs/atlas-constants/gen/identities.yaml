# ---------------------------------------------------------------------------
# Dual Blade (task-204). GMS introduced the third Rogue branch at v0.88, so
# these identities have no v83 constant and the mechanical bootstrap never
# surfaced them -- hand-added here exactly like the Big Bang block above.
#
# canonicalToken is the v0.92 wire id (the first RELEASED version), not a
# v83-era one: the branch does not exist at v83. That is a deliberate
# widening of the "canonical token == current v83 wire id" convention in
# gen/identities.go's package doc -- the token's only contract is that it is
# stable and unique within its domain, and the v92 ids satisfy both.
#
# Presence vs release: jobs 430-434 ARE present in gms 87's Skill.wz, but as
# an incomplete stub (17 of the 26 skill images the released versions carry;
# 4330001/4340001/4341000/4341002/4341003/4341004/4341006/4341007/4341008 are
# all absent, and 4300000 has no WZ name). availability.csv already gates
# that -- DualBlade is released=false at gms 87 and true at gms 92, gms 95
# and jms 185 -- so the identities auto-bind at v87 but never become
# Available there. Do not "fix" the v87 stub by flipping that row.
#
# Skill display names are the WZ names as served by atlas-data
# GET /api/data/skills/{id} against the provisioned gms 92.1 tenant
# (2026-08-09); job display names follow the repo's own job-naming
# convention, as every other job identity's does -- no WZ image carries a
# job name (String.wz has no Job.img; String.wz/Skill.img/<job>/bookName is
# a skill-book title such as "Chief Bandit's Tricks", and the STRING worker
# discards it), and "Blade" appears in none of the v92/v95/jms 185 client
# binaries. BladeRecruit for 430 was already pinned by the pre-existing
# `job.BladeRecruit` references in job/model.go and atlas-character-factory.
- name: BladeRecruitKataraMastery
  domain: skill
  canonicalToken: 4300000
  displayName: Katara Mastery
- name: BladeRecruitTripleStab
  domain: skill
  canonicalToken: 4301001
  displayName: Triple Stab
- name: BladeRecruitKataraBooster
  domain: skill
  canonicalToken: 4301002
  displayName: Katara Booster
