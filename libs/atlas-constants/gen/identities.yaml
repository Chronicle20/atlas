# Big-Bang-introduced identities (task-187 Task 1 audit, no v83 constant).
#
# Grounded in docs/tasks/task-187-version-aware-id-semantics/audit/
# bigbang-v092-v095.md (the v0.92<->v0.95 job-skill-membership reorg) plus
# the corresponding rows in divergences.csv. These wire ids have no
# pre-existing *Id = Id(N) constant in skill/constants.go, so the mechanical
# bootstrap above never surfaced them; they are hand-added here per the
# task-2 brief step 1 instruction, using the same job-prefixed naming
# convention as their sibling consts in the same job family.
#
# The v95 rename-TARGET tokens from the same audit rows, 11000005 and
# 12000005, are deliberately NOT added here: both already have an existing
# v83-era constant (DawnWarriorStage1ImprovedMaxHpIncreaseId and
# BlazeWizardStage1ImprovedMaxMpIncreaseId respectively) bound to a
# different, stale pre-Big-Bang meaning. Adding a second identity at the
# same token would collide (ValidateIdentityTokens forbids two identities
# sharing a token within a domain). The rename-SOURCE tokens (11000000,
# 12000000) have no such collision and are included below. Reconciling
# which identity a wireId of 11000005/12000005 binds to *per version* is
# Task 4's job (the wireId->identity binding table), not this namespace
# assembly step -- see task-2-report.md for the full writeup.
