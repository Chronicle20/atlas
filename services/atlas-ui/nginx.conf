server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames under /assets/, so a given URL's
    # bytes never change — cache them for a year.
    #
    # This block also stops the SPA fallback below from swallowing a missing
    # chunk: without it, a request for a chunk hash that no longer exists (tab
    # open across a redeploy) matched `location /` and came back as index.html
    # with `Content-Type: text/html`, which the ES module loader rejects. A
    # plain 404 is the honest answer; src/lib/utils/lazy-with-reload.ts turns
    # either failure into a one-shot page reload.
    #
    # No `always` on the add_header: it would apply the year-long immutable
    # header to the 404 below as well, so a browser that raced a redeploy
    # would cache "this chunk does not exist" for a year and never recover if
    # the deploy were rolled back. Without `always`, nginx emits the header on
    # 2xx/3xx only.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the map from route to current chunk hashes. Without an
    # explicit header it goes out with only ETag/Last-Modified, and browsers
    # apply heuristic freshness — a stale copy can be reused from disk cache
    # without revalidating, which defeats the reload-to-recover path.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
